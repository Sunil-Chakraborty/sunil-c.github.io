<script id="faq-data" type="application/json">[{"number": 1, "section": "A", "category": "General Information", "question": "What is CAS?", "answer": "CAS stands for Career Advancement Scheme. It is the scheme under which University teachers may be considered for promotion on fulfilling the prescribed service, academic performance/API, and other requirements."}, {"number": 2, "section": "A", "category": "General Information", "question": "Which CAS guideline is this chatbot based on?", "answer": "It is based on Jadavpur University’s “Guidelines for Promotion of University Teachers under Career Advancement Scheme (CAS) whose promotion is due on or after 07.12.2017.”"}, {"number": 3, "section": "A", "category": "General Information", "question": "Which UGC regulations are referred to in the guideline?", "answer": "The guideline refers to the UGC Regulations (4th Amendment), 2016, and UGC notification no. F.1-2/2016 dated 11 July 2016."}, {"number": 4, "section": "A", "category": "General Information", "question": "Does this guideline apply to promotions due before 07.12.2017?", "answer": "The title specifies that it is for teachers whose promotion is due on or after 07.12.2017. It does not specify the rules for promotions due before that date."}, {"number": 5, "section": "A", "category": "General Information", "question": "What does API stand for?", "answer": "API stands for Academic Performance Indicator."}, {"number": 6, "section": "A", "category": "General Information", "question": "What is PBAS?", "answer": "PBAS refers to the Performance Based Appraisal System scoring proforma mentioned in the guideline."}, {"number": 7, "section": "A", "category": "General Information", "question": "What are the API categories?", "answer": "The guideline groups API activities into:\n- Category I: Teaching, Learning and Evaluation Related Activities.\n- Category II: Professional Development, Co-curricular and Extension Activities.\n- Category III: Research and Academic Contributions."}, {"number": 8, "section": "A", "category": "General Information", "question": "Are API scores based only on a teacher’s declaration?", "answer": "The guideline provides for self-assessment, but the scores must be based on objectively verifiable records. The relevant screening-cum-evaluation committee or selection committee finalizes the assessment, as applicable."}, {"number": 9, "section": "A", "category": "General Information", "question": "Who finalizes the API assessment?", "answer": "For promotion of Assistant Professors to higher grades, the screening-cum-evaluation committee finalizes the assessment. For promotion to Associate Professor or Professor, the Selection Committee finalizes it, as specified in the guideline."}, {"number": 10, "section": "A", "category": "General Information", "question": "What are the direct teaching hours per week prescribed?", "answer": "The guideline specifies:\n- Assistant Professor: 16 hours per week.\n- Associate Professor: 14 hours per week.\n- Professor: 14 hours per week."}, {"number": 11, "section": "A", "category": "General Information", "question": "What activities are included in direct teaching hours?", "answer": "The note in the guideline states that the prescribed direct teaching hours include Lectures, Tutorials, Practical, Project Supervision, and Field Work."}, {"number": 12, "section": "A", "category": "General Information", "question": "Does the guideline specify a separate API score for every teaching activity?", "answer": "Category I provides a method for calculating scores from hours spent in direct teaching, examination duties, and innovative teaching-learning activities. The relevant maximum scores and divisors differ by career stage."}, {"number": 13, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "What activities are covered under Category I?", "answer": "Category I covers:\n- Direct Teaching.\n- Examination duties, including question-paper setting, invigilation, and evaluation of answer scripts.\n- Innovative teaching-learning methodologies, updating of subject contents/courses, mentoring, etc."}, {"number": 14, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "What is the maximum Category I score for an Assistant Professor?", "answer": "The maximum scores are:\n- Direct Teaching: 70.\n- Examination duties: 20.\n- Innovative Teaching: 10."}, {"number": 15, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "What is the maximum Category I score for an Associate Professor?", "answer": "The maximum scores are:\n- Direct Teaching: 60.\n- Examination duties: 20.\n- Innovative Teaching: 15."}, {"number": 16, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "What is the maximum Category I score for a Professor?", "answer": "The maximum scores are:\n- Direct Teaching: 60.\n- Examination duties: 10.\n- Innovative Teaching: 20."}, {"number": 17, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "How is the Direct Teaching score calculated for an Assistant Professor?", "answer": "The score is calculated as hours spent per academic year divided by 7.5, subject to the maximum score of 70."}, {"number": 18, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "How is the Direct Teaching score calculated for an Associate Professor?", "answer": "The score is calculated as hours spent per academic year divided by 7.75, subject to the maximum score of 60."}, {"number": 19, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "How is the Direct Teaching score calculated for a Professor?", "answer": "The score is calculated as hours spent per academic year divided by 7.75, subject to the maximum score of 60."}, {"number": 20, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "How is the Examination Duties score calculated?", "answer": "For all three levels, the score is based on hours spent per academic year divided by 10, subject to the applicable maximum:\n- Assistant Professor: 20.\n- Associate Professor: 20.\n- Professor: 10."}, {"number": 21, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "Which examination duties are counted under Category I?", "answer": "Question-paper setting, invigilation, and evaluation of answer scripts are listed."}, {"number": 22, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "How is the Innovative Teaching score calculated?", "answer": "The score is based on hours spent per academic year divided by 10, subject to the applicable maximum:\n- Assistant Professor: 10.\n- Associate Professor: 15.\n- Professor: 20."}, {"number": 23, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "What is included under Innovative Teaching?", "answer": "Innovative teaching-learning methodologies, updating of subject contents/courses, mentoring, and related activities are included."}, {"number": 24, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "Are self-declarations required for Category I?", "answer": "The guideline marks Direct Teaching, Examination Duties, and Innovative Teaching as self-declaration items. The declaration should be supported by objectively verifiable records, as required by the guideline."}, {"number": 25, "section": "B", "category": "Category I: Teaching, Learning and Evaluation", "question": "Is the Category I minimum the same for all CAS stages?", "answer": "No. Table II(A) prescribes different annual minimum scores for different promotion stages. Refer to the stage-wise minimums in Section E of this knowledge base."}, {"number": 26, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "What activities are covered under Category II?", "answer": "Category II covers:\n- Student-related co-curricular, extension, and field-based activities.\n- Contribution to the corporate life and management of the department and institution.\n- Professional Development activities."}, {"number": 27, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "What is the maximum API score for each Category II group?", "answer": "The guideline specifies a maximum of 15 for each of the three groups (a, b, and c)."}, {"number": 28, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "What student-related activities are included in Category II(a)?", "answer": "Examples include discipline-related co-curricular activities such as remedial classes, career counselling, study visits, student seminars and other events; other co-curricular activities such as cultural, sports, NSS and NCC activities; and extension/dissemination activities such as public or popular lectures, talks and seminars."}, {"number": 29, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "How is the score for Category II(a) calculated?", "answer": "It is based on hours spent per academic year divided by 10, subject to the maximum API score of 15."}, {"number": 30, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "What is included under contribution to corporate life and management?", "answer": "Participation in academic and administrative committees and responsibilities is included."}, {"number": 31, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "Which administrative responsibilities are mentioned?", "answer": "The guideline mentions responsibilities such as Dean, Principal, Chairperson, Convener, Teacher-in-Charge, and similar duties requiring regular office hours for their discharge."}, {"number": 32, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "Does participation in the Board of Studies count under Category II?", "answer": "Yes. Participation in the Board of Studies, Academic Committees, and Administrative Committees is listed under Category II(b)."}, {"number": 33, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "How is the score for Category II(b) calculated?", "answer": "It is based on hours spent per academic year divided by 10, subject to the maximum API score of 15."}, {"number": 34, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "What is included under Professional Development activities?", "answer": "Examples include participation in seminars, conferences, short-term training courses, industrial experience, talks, lectures in refresher/faculty development courses, dissemination, general articles, and other contributions."}, {"number": 35, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "How is the score for Category II(c) calculated?", "answer": "It is based on hours spent per academic year divided by 10, subject to the maximum API score of 15."}, {"number": 36, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "Are examples or supporting records required for Category II?", "answer": "The guideline specifies self-declaration with examples for the listed Category II activities and requires objectively verifiable records."}, {"number": 37, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "Who finalizes Category II scores?", "answer": "The relevant screening-cum-evaluation committee or Selection Committee finalizes the assessment, depending on the promotion stage."}, {"number": 38, "section": "C", "category": "Category II: Professional Development, Co-curricular and Extension", "question": "Can the University detail or adjust Category II activities?", "answer": "The guideline states that Universities may detail the activities or adjust weightages where institutional specificities require it, without changing the minimum total API score required under Category II."}, {"number": 39, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "What does Category III cover?", "answer": "Category III covers research and academic contributions, including research papers, books and chapters, research projects, consultancy projects, project outcomes/outputs, research guidance, fellowships, awards, invited lectures/papers, and e-learning material."}, {"number": 40, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "Are Category III scores automatically accepted as declared?", "answer": "No. The scores are based on verifiable records and are finalized by the relevant committee."}, {"number": 41, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "Does the research-paper scoring distinguish between faculty disciplines?", "answer": "Yes. The guideline distinguishes between Sciences/Engineering/Agriculture/Medical/Veterinary Sciences and Languages/Humanities/Arts/Social Sciences/Library/Physical Education/Management."}, {"number": 42, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How are papers in UGC-notified refereed journals scored?", "answer": "The guideline states that the score is 25 plus an impact-factor augmentation:\n- Impact factor below 1: additional 5 points.\n- Impact factor between 1 and 2: additional 10 points.\n- Impact factor between 2 and 5: additional 15 points.\n- Impact factor between 5 and 10: additional 20 points.\n- Impact factor above 10: additional 25 points."}, {"number": 43, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How are papers in other reputed or subject-specific journals identified by the University scored?", "answer": "Clarification (B) states that the author will get 10 points for each publication in other reputed journals notified by the relevant authority and subject-specific reputed journals identified by the University."}, {"number": 44, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How are impact-factor augmentation points shared in joint publications?", "answer": "For joint publications, the impact-factor augmentation is shared as follows: the First and Principal/Corresponding Author/Supervisor/Mentor share equally 70% of the total points, and the remaining 30% is shared equally among all other authors."}, {"number": 45, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "Does the guideline give a separate fixed score for every journal title?", "answer": "No. It provides the scoring method and refers to UGC-notified refereed journals and other reputed/subject-specific journals identified by the University. Whether a particular journal qualifies must be verified against the applicable list and University identification."}, {"number": 46, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How many points are awarded for a single-author book published by an international publisher?", "answer": "The guideline specifies 30 points per book for a single author, for the relevant text/reference/relevant book category with ISBN/ISSN number."}, {"number": 47, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How many points are awarded for a single-author book published by a national-level publisher?", "answer": "The guideline specifies 20 points per book for a single author, for the relevant subject/relevant book category with ISBN/ISSN number or State/Central Government publications."}, {"number": 48, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How many points are awarded for a single-author book published by another local publisher?", "answer": "The guideline specifies 15 points per book for a single author, for the relevant subject/relevant book category with ISBN/ISSN number."}, {"number": 49, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How are chapters in books scored?", "answer": "The guideline specifies:\n- International-level publisher: 10 points per chapter.\n- National-level publisher: 5 points per chapter. The listed publications should have ISBN/ISSN numbers. Conference proceedings with ISBN/ISSN numbers are also mentioned."}, {"number": 50, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How are journal-paper reviews/refereeing scored?", "answer": "Refereeing of journal papers from the UGC list is assigned 5 points per journal paper."}, {"number": 51, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "What types of research projects are listed under Category III(C)(i)?", "answer": "Sponsored projects are grouped by grant amount. The thresholds differ between the two faculty groupings shown in the guideline."}, {"number": 52, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "What is the score for a major sponsored project for Sciences/Engineering/Agriculture/Medical/Veterinary Sciences?", "answer": "For this faculty grouping:\n- Major project with grant above Rs. 30 lakhs: 20 points per project.\n- Major project with grant above Rs. 5 lakhs up to Rs. 30 lakhs: 15 points per project.\n- Minor project with grant above Rs. 1 lakh up to Rs. 5 lakhs: 10 points per project."}, {"number": 53, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "What is the score for a major sponsored project for Languages/Humanities/Arts/Social Sciences/Library/Physical Education/Management?", "answer": "For this faculty grouping:\n- Major project with grant above Rs. 5 lakhs: 20 points per project.\n- Major project with grant above Rs. 3 lakhs up to Rs. 5 lakhs: 15 points per project.\n- Minor project with grant above Rs. 0.5 lakh up to Rs. 3 lakhs: 10 points per project."}, {"number": 54, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How are consultancy projects scored?", "answer": "The guideline specifies 10 points for every Rs. 10 lakhs mobilized for the Sciences/Engineering/Agriculture/Medical/Veterinary Sciences grouping, with a minimum of Rs. 10 lakhs. For the Languages/Humanities/Arts/Social Sciences/Library/Physical Education/Management grouping, it specifies 10 points for every Rs. 2 lakhs mobilized, with a minimum of Rs. 2 lakhs."}, {"number": 55, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "What project outcomes or outputs are listed?", "answer": "The guideline lists patent, technology transfer, product, and process under the Sciences/Engineering/Agriculture/Medical/Veterinary Sciences grouping. For the other faculty grouping, it lists major policy documents prepared for specified international, Central Government, State Government, and local bodies."}, {"number": 56, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "What is the score for a patent or technology-transfer/product/process outcome?", "answer": "The guideline specifies 30 points for each international-level output or patent and 20 points for each national-level output or patent."}, {"number": 57, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "What scores are specified for major policy documents?", "answer": "The guideline specifies:\n- International bodies: 30 points.\n- Central Government: 20 points.\n- State Government: 10 points.\n- Local bodies: 5 points."}, {"number": 58, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How is M.Phil. research guidance scored?", "answer": "A degree awarded is assigned 5 points per candidate."}, {"number": 59, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How is Ph.D. research guidance scored?", "answer": "The guideline specifies 15/10/5 points per candidate for the listed stages: degree awarded, thesis submitted, and registered, respectively. The table also shows these stages for the relevant faculty groupings; consult the applicable column in the source guideline."}, {"number": 60, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How are fellowships and awards scored?", "answer": "The guideline specifies:\n- International award/fellowship from academic bodies: 15 points.\n- National award/fellowship from academic bodies: 10 points.\n- State/University-level award from academic bodies: 5 points."}, {"number": 61, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How are invited lectures and papers presented scored?", "answer": "The guideline specifies:\n- International level: 7 points per lecture and 5 points per paper presented.\n- National level: 5 points per lecture and 3 points per paper presented.\n- State/University level: 3 points per lecture and 2 points per paper presented."}, {"number": 62, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "Is there a cap on scores for invited lectures and papers presented?", "answer": "Yes. The score under Category III(E)(ii) is restricted to 20% of the minimum fixed for Category III for the relevant assessment period."}, {"number": 63, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "How is development of e-learning delivery process/material scored?", "answer": "The guideline specifies 10 points per module."}, {"number": 64, "section": "D", "category": "Category III: Research and Academic Contributions", "question": "Does the guideline explain the documents required for every Category III claim?", "answer": "The guideline requires verifiable records but does not provide a complete item-by-item document checklist in this document. Applicants should follow the University’s current CAS portal instructions and IQAC directions for supporting documents."}, {"number": 65, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What are the minimum Category I scores for Stage 1 to Stage 2?", "answer": "The minimum Category I score is 80 per year."}, {"number": 66, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What are the minimum Category I scores for Stage 2 to Stage 3?", "answer": "The minimum Category I score is 80 per year."}, {"number": 67, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum Category I score for Stage 3 to Associate Professor (Stage 4)?", "answer": "The minimum Category I score is 75 per year."}, {"number": 68, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum Category I score for Associate Professor (Stage 4) to Professor (Stage 5)?", "answer": "The minimum Category I score is 70 per year."}, {"number": 69, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum Category II score for each promotion stage?", "answer": "The minimum Category II score is 50 per assessment period for all four promotion stages shown in Table II(A)."}, {"number": 70, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum Category III score for Stage 1 to Stage 2?", "answer": "The minimum Category III score is 20 per assessment period."}, {"number": 71, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum Category III score for Stage 2 to Stage 3?", "answer": "The minimum Category III score is 50 per assessment period."}, {"number": 72, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum Category III score for Stage 3 to Associate Professor (Stage 4)?", "answer": "The minimum Category III score is 75 per assessment period."}, {"number": 73, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum Category III score for Associate Professor (Stage 4) to Professor (Stage 5)?", "answer": "The minimum Category III score is 100 per assessment period."}, {"number": 74, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum combined score under Categories II and III for Stage 1 to Stage 2?", "answer": "The minimum combined score is 90 per assessment period."}, {"number": 75, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum combined score under Categories II and III for Stage 2 to Stage 3?", "answer": "The minimum combined score is 120 per assessment period."}, {"number": 76, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum combined score under Categories II and III for Stage 3 to Associate Professor (Stage 4)?", "answer": "The minimum combined score is 150 per assessment period."}, {"number": 77, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "What is the minimum combined score under Categories II and III for Associate Professor (Stage 4) to Professor (Stage 5)?", "answer": "The minimum combined score is 180 per assessment period."}, {"number": 78, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "Can a teacher make up a shortfall in Category II through Category III, or vice versa?", "answer": "The note to Table II(A) states that teachers may score the balance of points from either Category II or Category III to achieve the minimum score required under Category II + III. The minimum combined score must still be met."}, {"number": 79, "section": "E", "category": "Minimum API Scores: Table II(A)", "question": "Does meeting the minimum API score automatically guarantee promotion?", "answer": "No. The guideline also prescribes service requirements and screening/selection processes. The applicable committee process must be completed."}, {"number": 80, "section": "F", "category": "Expert Assessment and Committee Process", "question": "What assessment process applies to Stage 1 to Stage 2?", "answer": "Table II(A) specifies a screening-cum-evaluation committee. The table states that there are no separate expert-assessment points and that the screening committee verifies API scores."}, {"number": 81, "section": "F", "category": "Expert Assessment and Committee Process", "question": "What assessment process applies to Stage 2 to Stage 3?", "answer": "Table II(A) specifies a screening-cum-evaluation committee. The table states that there are no separate expert-assessment points and that the screening committee verifies API scores."}, {"number": 82, "section": "F", "category": "Expert Assessment and Committee Process", "question": "What assessment process applies to Stage 3 to Associate Professor (Stage 4)?", "answer": "A Selection Committee process applies. The expert-assessment weightage is:\n- 30% for Research Contribution.\n- 50% for Assessment of Domain Knowledge and Teaching Practices.\n- 20% for Interview Performance."}, {"number": 83, "section": "F", "category": "Expert Assessment and Committee Process", "question": "What assessment process applies to Associate Professor (Stage 4) to Professor (Stage 5)?", "answer": "A Selection Committee process applies. The expert-assessment weightage is:\n- 50% for Research Contribution.\n- 30% for Assessment of Domain Knowledge and Teaching Practices.\n- 20% for Interview Performance."}, {"number": 84, "section": "F", "category": "Expert Assessment and Committee Process", "question": "What is the total expert-assessment weightage?", "answer": "The total weightage is 100, and the minimum required for promotion is 50, as stated in Table II(A)."}, {"number": 85, "section": "F", "category": "Expert Assessment and Committee Process", "question": "How is Research Contribution weightage determined?", "answer": "The guideline states that Research Contribution weightage in the final interview comes directly from Category III. A candidate who obtains the minimum Category III API required for eligibility gets the maximum weightage for Research Contribution in the final selection."}, {"number": 86, "section": "F", "category": "Expert Assessment and Committee Process", "question": "How is Domain Knowledge and Teaching Practices weightage determined?", "answer": "The guideline states that this weightage comes directly from Categories I, II, and III. A candidate who obtains the minimum combined API required for eligibility across Categories I, II, and III gets the maximum weightage for Domain Knowledge and Teaching Practices in the final selection."}, {"number": 87, "section": "F", "category": "Expert Assessment and Committee Process", "question": "Is there an interview for every CAS stage?", "answer": "Table II(A) specifies a Selection Committee and interview-performance weightage for Stage 3 to Stage 4 and Stage 4 to Stage 5. For Stage 1 to Stage 2 and Stage 2 to Stage 3, it specifies screening-cum-evaluation and API verification, with no separate points."}, {"number": 88, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "What are the requirements for Assistant Professor Stage 1 to Stage 2?", "answer": "The guideline specifies:\n- Four years of service with Ph.D.; or\n- Five years of service with M.Phil. or a PG degree in professional courses such as LLM, M.Tech, M.V.Sc., M.D.; or\n- Six years of service without Ph.D./M.Phil./PG degree in professional courses. It also requires the minimum cumulative API score under Table II(A), one Orientation and one Refresher Course/Research Methodology Course of 2/3 weeks’ duration, and screening-cum-verification."}, {"number": 89, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "What courses are required for promotion from Stage 1 to Stage 2?", "answer": "One Orientation Course and one Refresher Course or Research Methodology Course of 2/3 weeks’ duration are specified."}, {"number": 90, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "What are the requirements for Assistant Professor Stage 2 to Stage 3?", "answer": "The guideline specifies five completed years of service in Stage 2, the minimum cumulative API scores under Table II(A), one prescribed course/programme of 2/3 weeks’ duration from the listed categories, and screening-cum-verification."}, {"number": 91, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "Which course/programme is required for promotion from Stage 2 to Stage 3?", "answer": "One course/programme from among refresher courses, methodology workshops, training, Teaching-Learning-Evaluation Technology Programmes, Soft Skills Development Programmes, and Faculty Development Programmes, of 2/3 weeks’ duration."}, {"number": 92, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "What are the requirements for Assistant Professor Stage 3 to Associate Professor Stage 4?", "answer": "The guideline specifies:\n- Three completed years of service in Stage 3.\n- Minimum cumulative API scores under Table II(A).\n- At least three publications in the entire period as Assistant Professor (twelve years).\n- One course/programme of at least one week from the listed categories.\n- A Selection Committee process."}, {"number": 93, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "How many publications are required for promotion from Stage 3 to Associate Professor Stage 4?", "answer": "At least three publications in the entire period as Assistant Professor (twelve years) are specified."}, {"number": 94, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "Are publication exemptions mentioned for College teachers?", "answer": "Yes. The guideline states that, in the case of College teachers, an exemption of one publication may be given to M.Phil. holders and an exemption of two publications may be given to Ph.D. holders. This statement is specifically about College teachers."}, {"number": 95, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "Which course/programme is required for promotion from Stage 3 to Stage 4?", "answer": "One course/programme from among methodology workshops, training, Teaching-Learning-Evaluation Technology Programmes, Soft Skills Development Programmes, and Faculty Development Programmes, of a minimum one-week duration."}, {"number": 96, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "What are the requirements for Associate Professor Stage 4 to Professor Stage 5?", "answer": "The guideline specifies:\n- Three completed years of service in Stage 4.\n- Minimum cumulative API scores under Table II(A).\n- A minimum of five publications since the period the teacher was placed in Stage 3.\n- A Selection Committee process."}, {"number": 97, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "How many publications are required for promotion from Associate Professor Stage 4 to Professor Stage 5?", "answer": "A minimum of five publications since the period the teacher is placed in Stage 3 is specified."}, {"number": 98, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "Can two assessment periods be combined for API scores for promotion from Stage 4 to Stage 5?", "answer": "The note in Table III states that teachers may combine two assessment periods (in Stages 2 and 3) to achieve the minimum API scores, if required. The wording should be checked with the competent University authority for application to an individual case."}, {"number": 99, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "Does the guideline prescribe a specific format for the CAS application?", "answer": "This 10-page guideline sets out API categories, scores, minimums, service requirements, and committee processes. It does not specify a complete application-form format."}, {"number": 100, "section": "G", "category": "Service and Academic Requirements: Table III", "question": "Does this guideline provide a complete list of documents to upload in the CAS portal?", "answer": "No. It requires objectively verifiable records but does not provide a complete portal upload checklist. Follow the current CAS portal instructions and IQAC communications for document requirements."}, {"number": 101, "section": "H", "category": "Common Clarifications and Limitations", "question": "Can the chatbot confirm whether I am eligible for promotion?", "answer": "The chatbot can explain the requirements stated in the guideline, but it cannot confirm an individual’s eligibility. Eligibility depends on verified service details, assessment period, API records, qualifications, publications, courses, and the applicable University rules and committee assessment. Please contact IQAC for case-specific confirmation."}, {"number": 102, "section": "H", "category": "Common Clarifications and Limitations", "question": "Can the chatbot calculate my final API score?", "answer": "It can explain the scoring formulas in the guideline. A final score should not be treated as approved until supporting records are verified and the relevant committee finalizes the assessment."}, {"number": 103, "section": "H", "category": "Common Clarifications and Limitations", "question": "What should I do if my activity is not listed in the guideline?", "answer": "The guideline does not provide a definitive score for every possible activity. Please contact IQAC or the competent University authority for clarification before claiming a score."}, {"number": 104, "section": "H", "category": "Common Clarifications and Limitations", "question": "What if my question concerns a later UGC regulation or a revised University order?", "answer": "This knowledge base is based only on the specified Jadavpur University guideline referring to the UGC 4th Amendment Regulations, 2016. It does not establish whether later regulations or University orders have amended or superseded any provision. Please consult the latest applicable University order or IQAC."}, {"number": 105, "section": "H", "category": "Common Clarifications and Limitations", "question": "Does the guideline specify how API scores are rounded?", "answer": "No rounding method is specified in the available guideline."}, {"number": 106, "section": "H", "category": "Common Clarifications and Limitations", "question": "Does the guideline specify whether a particular online course, webinar, journal, publisher, or conference is acceptable?", "answer": "It gives broad categories and conditions but does not identify every course, webinar, journal, publisher, or conference. The eligibility of a specific item should be verified with IQAC or the competent authority."}, {"number": 107, "section": "H", "category": "Common Clarifications and Limitations", "question": "Does the guideline specify the exact assessment-period dates for every promotion stage?", "answer": "The tables refer to annual scores and assessment-period scores, but this document does not provide individual applicants’ assessment-period dates. Confirm the applicable period from the University/CAS portal or IQAC."}, {"number": 108, "section": "H", "category": "Common Clarifications and Limitations", "question": "Does the guideline specify the exact documents required as proof of teaching hours?", "answer": "It identifies teaching activities and self-declaration, and requires objectively verifiable records. It does not provide an exhaustive list of acceptable proof documents."}, {"number": 109, "section": "H", "category": "Common Clarifications and Limitations", "question": "Does the guideline specify a minimum API score in every sub-item of Category II?", "answer": "Table II(A) specifies the minimum Category II score cumulatively for the assessment period. It does not prescribe a separate minimum for each of the three Category II groups."}, {"number": 110, "section": "H", "category": "Common Clarifications and Limitations", "question": "Can I claim the maximum score in a category even if my calculated score is higher?", "answer": "The activity tables specify maximum scores for the relevant items or groups. Scores are subject to those maxima and to verification by the relevant committee."}, {"number": 111, "section": "H", "category": "Common Clarifications and Limitations", "question": "Where should I seek clarification about a CAS rule not covered here?", "answer": "Please contact the Internal Quality Assurance Cell (IQAC), Jadavpur University, or the competent University authority."}]</script>
<script>
// ==== ENGINE START (no DOM access below this line until ENGINE END) ====
const FALLBACK_MESSAGE =
  "This point is not specified in the CAS guideline available in the chatbot. " +
  "Please contact IQAC / the competent University authority for clarification.";

const CFG = {
  threshold: 0.55,        // best match must score at least this
  margin: 0.04,           // runner-up this close => ambiguous
  suggestThreshold: 0.30, // minimum score for a "Did you mean" suggestion
  maxSuggestions: 3,
  maxKeywordList: 15,
  maxKeywordTerms: 3
};
const STOP = new Set(["what","is","are","the","a","an","of","for","in","to","how","do","does",
  "can","about","and","or","on","my","me","i","it","tell","show","list","related","regarding"]);

function tokens(t) { return t.toLowerCase().match(/[\p{L}\p{N}_]+/gu) || []; }
function analyze(t) {                       // unigrams + bigrams, like TF-IDF (1,2)
  const w = tokens(t), out = w.slice();
  for (let i = 0; i < w.length - 1; i++) out.push(w[i] + " " + w[i + 1]);
  return out;
}
function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

const GROUP_A = /\b(sciences?|engineering|agriculture|medical|veterinary)\b/;
const GROUP_B = /\b(languages?|humanities|arts|social|library|physical education|management)\b/;
function groupsIn(text) {
  const t = text.toLowerCase().replace(/social sciences?/g, "social");
  const g = new Set();
  if (GROUP_A.test(t)) g.add("A");
  if (GROUP_B.test(t)) g.add("B");
  return g;
}

function createEngine(entries) {
  const n = entries.length;
  const docs = entries.map(e => analyze(e.question));
  const df = new Map();
  docs.forEach(d => new Set(d).forEach(t => df.set(t, (df.get(t) || 0) + 1)));
  const idf = new Map();
  df.forEach((c, t) => idf.set(t, Math.log((1 + n) / (1 + c)) + 1));

  function vectorize(terms, vocabOnly) {
    const tf = new Map();
    terms.forEach(t => { if (!vocabOnly || idf.has(t)) tf.set(t, (tf.get(t) || 0) + 1); });
    const v = new Map(); let norm = 0;
    tf.forEach((c, t) => { const w = (1 + Math.log(c)) * idf.get(t); v.set(t, w); norm += w * w; });
    norm = Math.sqrt(norm);
    if (norm > 0) v.forEach((w, t) => v.set(t, w / norm));
    return v;
  }
  const docVecs = docs.map(d => vectorize(d, false));

  // Acronyms = ALL-CAPS words in stored questions (roman numerals excluded).
  const known = new Set();
  entries.forEach(e => (e.question.match(/\b[A-Z]{2,}\b/g) || [])
    .forEach(w => { if (!/^[IVX]+$/.test(w)) known.add(w); }));
  const acronyms = text => new Set((text.match(/\b[A-Za-z]{2,}\b/g) || [])
    .map(w => w.toUpperCase()).filter(w => known.has(w)));
  function acronymConflict(q, m) {
    const qa = acronyms(q), ma = acronyms(m);
    const missing = [...qa].filter(a => !ma.has(a));
    const extra = [...ma].filter(a => !qa.has(a));
    if (missing.some(a => a !== "CAS")) return true;   // R1
    return missing.length > 0 && extra.length > 0;     // R2: swapped acronym
  }

  function keywordMatches(question) {
    const terms = tokens(question).filter(t => !STOP.has(t));
    if (!terms.length || terms.length > CFG.maxKeywordTerms) return [];
    const pats = terms.map(t => new RegExp("\\b" + esc(t) + "s?\\b", "i"));
    return entries.filter(e => pats.every(p => p.test(e.question)));
  }

  function getEntry(id) { return entries.find(e => e.number === id) || null; }

  function ask(question) {
    question = (question || "").trim();
    if (!question) return { matched: false, message: FALLBACK_MESSAGE, suggestions: [], total: 0 };

    const qv = vectorize(analyze(question), true);
    const scores = docVecs.map(dv => {
      let s = 0; qv.forEach((w, t) => { const x = dv.get(t); if (x) s += w * x; }); return s;
    });
    const order = scores.map((s, i) => i).sort((a, b) => scores[b] - scores[a]);
    const best = order[0], second = order[1], bestScore = scores[best];

    const fallback = () => {
      const kw = keywordMatches(question);
      if (kw.length) return { matched: false, message: FALLBACK_MESSAGE,
        suggestions: kw.slice(0, CFG.maxKeywordList), total: kw.length };
      const sug = order.slice(0, CFG.maxSuggestions)
        .filter(i => scores[i] >= CFG.suggestThreshold).map(i => entries[i]);
      return { matched: false, message: FALLBACK_MESSAGE, suggestions: sug, total: sug.length };
    };

    if (bestScore < CFG.threshold) return fallback();                       // threshold
    if (bestScore - scores[second] < CFG.margin) return fallback();         // ambiguity
    const e = entries[best];
    const fg = groupsIn(e.question);                                        // rule 5
    if (fg.size === 1) {
      const qg = groupsIn(question);
      if (![...fg].some(g => qg.has(g))) return fallback();
    }
    if (acronymConflict(question, e.question)) return fallback();           // rule 7
    return { matched: true, message: e.answer, entry: e, score: bestScore, suggestions: [], total: 0 };
  }
  return { ask, getEntry };
}
// ==== ENGINE END ====

// ---- UI ----
const ENTRIES = JSON.parse(document.getElementById("faq-data").textContent);
const engine = createEngine(ENTRIES);
const $ = id => document.getElementById(id);

function showAnswer(text, entry) {
  $("a").textContent = text;
  $("meta").textContent = entry ? entry.category + " | CAS FAQ Q" + entry.number + ", Section " + entry.section : "";
}

function ask() {
  const r = engine.ask($("q").value);
  showAnswer(r.message, r.entry || null);
  const box = $("sugg");
  box.textContent = "";
  if (r.matched || !r.suggestions.length) return;

  const h = document.createElement("div");
  h.style.fontWeight = "bold";
  h.textContent = "Did you mean one of these approved questions? Click the one you meant to confirm:";
  box.appendChild(h);
  if (r.total > r.suggestions.length) {
    const note = document.createElement("div");
    note.id = "note";
    note.textContent = "Showing " + r.suggestions.length + " of " + r.total +
      " approved questions containing this word. Add more words to narrow the list.";
    box.appendChild(note);
  }
  const list = document.createElement("div");
  list.id = "list";
  box.appendChild(list);
  r.suggestions.forEach(s => {
    const b = document.createElement("button");
    b.className = "sq";
    b.textContent = s.question;                 // textContent: no HTML injection
    b.onclick = () => { showAnswer(s.answer, s); box.textContent = ""; };
    list.appendChild(b);
  });
}
$("askBtn").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
