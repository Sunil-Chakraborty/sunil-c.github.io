f \u0986\u09b2\u09cb\u0995-\u09a8\u09bf\u09df\u09a8\u09cd\u09a4\u09cd\u09b0\u09bf\u09a4 \u09b8\u09c1\u0987\u099a\u09c7 \u09b0\u09c2\u09aa\u09be\u09a8\u09cd\u09a4\u09b0 \u0995\u09b0\u09c7\u09a8\u0964\n.\n\u09aa\u09bf\u099f\u09be\u09b0 \u09b9\u09c7\u0997\u09c7\u09ae\u09be\u09a8 \u0993 \u099c\u09b0\u09cd\u099c \u09a8\u09be\u0997\u09c7\u09b2\u0993 \u0995\u09be\u09b0\u09cd\u09b2\u09c7\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u098f \u09ac\u099b\u09b0 \u09a8\u09cb\u09ac\u09c7\u09b2 \u09aa\u09c7\u09df\u09c7\u099b\u09c7\u09a8\u0964\n.\n\u0985\u09a8\u09cd\u09af\u09a6\u09bf\u0995\u09c7 \u09ae\u09bf\u09b6\u09c7\u09b2 \u09ae\u09a8\u099c\u09c7  \u0986\u09ac\u09bf\u09b7\u09cd\u0995\u09be\u09b0 \u0995\u09b0\u09c7\u099b\u09c7\u09a8 \u09ac\u09cd\u09b0\u09c7\u09a8 \u0995\u09cd\u09af\u09be\u09a8\u09cd\u09b8\u09be\u09b0 \u0995\u09c0\u09ad\u09be\u09ac\u09c7 \u09ae\u09b8\u09cd\u09a4\u09bf\u09b7\u09cd\u0995\u09c7\u09b0 \u09b8\u09bf\u0997\u09a8\u09cd\u09af\u09be\u09b2 \u09b9\u09be\u0987\u099c\u09cd\u09af\u09be\u0995 \u0995\u09b0\u09c7 \u09ac\u09c3\u09a6\u09cd\u09a7\u09bf \u09aa\u09be\u09df, \u09af\u09be \u0995\u09cd\u09af\u09be\u09a8\u09cd\u09b8\u09be\u09b0 \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be\u09df \u098f\u0995 \u09ac\u09bf\u09b6\u09be\u09b2 \u09ae\u09be\u0987\u09b2\u09ab\u09b2\u0995 \u09a7\u09b0\u09be \u09b9\u09df\u0964 \u09ae\u09a8\u099c\u09c7 \u0995\u09c7 \u09ac\u09b2\u09be \u09b9\u09df \u0995\u09cd\u09af\u09be\u09a8\u09b8\u09be\u09b0 \u09a8\u09bf\u0989\u09b0\u09cb\u09b8\u09be\u09df\u09c7\u09a8\u09cd\u09b8\u09c7\u09b0 \u09ac\u09b0\u09cd\u09a4\u09ae\u09be\u09a8 \u09ac\u09bf\u09b6\u09cd\u09ac\u09c7\u09b0 \u09b8\u09ac\u099a\u09c7\u09df\u09c7 \u09b6\u09c0\u09b0\u09cd\u09b7 \u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u09c0\u0964\n.\n\u09b6\u09bf\u09b6\u09c1\u09a6\u09c7\u09b0 \u098f\u0995\u099f\u09bf \u0985\u09a4\u09cd\u09af\u09a8\u09cd\u09a4 \u09ae\u09be\u09b0\u09be\u09a4\u09cd\u09ae\u0995 \u0993 \u09a8\u09bf\u09b0\u09be\u09ae\u09df-\u0985\u09af\u09cb\u0997\u09cd\u09af \u09ac\u09cd\u09b0\u09c7\u09a8 \u099f\u09bf\u0989\u09ae\u09be\u09b0 \u09b9\u09b2\u09cb \u09a1\u09bf\u0986\u0987\u09aa\u09bf\u099c\u09bf (Diffuse Intrinsic Pontine Glioma)\u0964 \u09ae\u09a8\u099c\u09c7 \u09b9\u09b2\u09c7\u09a8 \u09aa\u09cd\u09b0\u09a5\u09ae \u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u09c0 \u09af\u09bf\u09a8\u09bf \u09b2\u09cd\u09af\u09be\u09ac\u09b0\u09c7\u099f\u09b0\u09bf\u09a4\u09c7 \u098f\u0987 \u0995\u09cd\u09af\u09be\u09a8\u09b8\u09be\u09b0\u09c7\u09b0 \u0995\u09cb\u09b7 \u09b8\u09ab\u09b2\u09ad\u09be\u09ac\u09c7 \u0995\u09be\u09b2\u099a\u09be\u09b0 \u0995\u09b0\u09a4\u09c7 \u09aa\u09c7\u09b0\u09c7\u099b\u09bf\u09b2\u09c7\u09a8\u0964\n.\n\u0995\u09cd\u09af\u09be\u09a8\u09b8\u09be\u09b0 \u09b0\u09cb\u0997\u09c0\u09a6\u09c7\u09b0 \u0995\u09bf\u09ae\u09cb\u09a5\u09c7\u09b0\u09be\u09aa\u09bf\u09b0 \u09aa\u09b0 \u09af\u09c7 \u09ae\u09be\u09a8\u09b8\u09bf\u0995 \u09af\u09c7 \u09ac\u09bf\u09ad\u09cd\u09b0\u09be\u09a8\u09cd\u09a4\u09bf  \u09b9\u09df, \u09a4\u09be\u09b0 \u09aa\u09c7\u099b\u09a8\u09c7\u09b0 \u09b8\u09cd\u09a8\u09be\u09df\u09ad\u09bf\u09a4\u09cd\u09a4\u09bf\u0995 \u09af\u09c7 \u0995\u09be\u09b0\u09a3 \u0993 \u09ae\u09be\u0987\u0995\u09cd\u09b0\u09cb\u0997\u09cd\u09b2\u09bf\u09df\u09be \u0995\u09cb\u09b7\u09c7\u09b0 \u09ad\u09c2\u09ae\u09bf\u0995\u09be \u09a4\u09bf\u09a8\u09bf\u0987 \u09aa\u09cd\u09b0\u09a5\u09ae \u0989\u09a8\u09cd\u09ae\u09cb\u099a\u09a8 \u0995\u09b0\u09c7\u099b\u09bf\u09b2\u09c7\u09a8\u0964\n.\n\u0995\u09be\u09b0\u09cd\u09b2 \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be \u09a8\u09be \u0995\u09b0\u09b2\u09c7\u0993 \u09ae\u09bf\u09b6\u09c7\u09b2 \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09a8\u09bf\u099c\u09c7 \u09aa\u09cd\u09b0\u09cd\u09af\u09be\u0995\u099f\u09bf\u09b8\u09bf\u0982 \u09a1\u09be\u0995\u09cd\u09a4\u09be\u09b0\u0993\u0964\n.\n\u09ae\u09bf\u09b6\u09c7\u09b2 \u09a4\u09be\u0981\u09b0 \u09b2\u09cd\u09af\u09be\u09ac\u09c7\u09b0 \u0986\u09ac\u09bf\u09b7\u09cd\u0995\u09be\u09b0\u0995\u09c7 \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u0995\u09cd\u09b2\u09bf\u09a8\u09bf\u0995\u09cd\u09af\u09be\u09b2 \u099f\u09cd\u09b0\u09be\u09df\u09be\u09b2\u09c7\u09b0 \u09ae\u09be\u09a7\u09cd\u09af\u09ae\u09c7 \u09ac\u09cd\u09b0\u09c7\u09a8 \u0995\u09cd\u09af\u09be\u09a8\u09cd\u09b8\u09be\u09b0\u09c7 \u0986\u0995\u09cd\u09b0\u09be\u09a8\u09cd\u09a4 \u09b6\u09bf\u09b6\u09c1\u09a6\u09c7\u09b0 \u099c\u09c0\u09ac\u09a8 \u09ac\u09be\u0981\u099a\u09be\u09a4\u09c7 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09c7\u09a8\u0964 \u098f\u0987 \u09a6\u09c1\u0987 \u0985\u09ac\u09bf\u09b6\u09cd\u09ac\u09be\u09b8\u09cd\u09af \u09aa\u09cd\u09b0\u09a4\u09bf\u09ad\u09be \u09af\u0996\u09a8 \u098f\u0995 \u0998\u09b0\u09c7, \u09a4\u0996\u09a8 \u0995\u09df\u09c7\u0995 \u09ac\u099b\u09b0\u09c7\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7 \u0986\u09b0\u0993 \u098f\u0995\u099f\u09bf \u09a8\u09cb\u09ac\u09c7\u09b2 \u098f\u0987 \u0998\u09b0\u09c7\u0987 \u0986\u09b8\u09a4\u09c7 \u09af\u09be\u099a\u09cd\u099b\u09c7\u0964 \u09ae\u09bf\u09b6\u09c7\u09b2\u09c7\u09b0 \u0997\u09ac\u09c7\u09b7\u09a3\u09be\u0993 \u09a4\u09be\u0987 \u09aa\u09cd\u09b0\u09ae\u09be\u09a3 \u0995\u09b0\u09c7\u0964\n.\n\u0986\u09b0 \u09b8\u09c7\u099f\u09be \u09af\u09a6\u09bf \u09b9\u09df\u09c7 \u09af\u09be\u09df \u0997\u09be\u09b0\u09cd\u099f\u09bf \u0995\u09cb\u09b0\u09bf-\u0995\u09be\u09b0\u09cd\u09b2 \u0995\u09cb\u09b0\u09bf \u0993 \u09ae\u09c7\u09ac\u09cd\u09b0\u09bf\u099f \u09ae\u09cb\u09b8\u09be\u09b0 \u0993 \u098f\u09a1\u09ad\u09be\u09b0\u09cd\u09a1 \u09ae\u09cb\u09b8\u09be\u09b0 \u09a6\u09ae\u09cd\u09aa\u09a4\u09cd\u09a4\u09bf\u09b0 \u09aa\u09b0 \u09a4\u09be\u09b0\u09be \u09b9\u09ac\u09c7 \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be \u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u09c7 \u09a8\u09cb\u09ac\u09c7\u09b2\u099c\u09df\u09c0 \u09a4\u09c3\u09a4\u09c0\u09df \u0995\u09cb\u09a8 \u09a6\u09ae\u09cd\u09aa\u09a4\u09cd\u09a4\u09bf\u0964\n.\n\u09ac\u09be\u0999\u09be\u09b2\u09c0 \u09a6\u09ae\u09cd\u09aa\u09a4\u09cd\u09a4\u09bf\u09b0\u09be \u09af\u0996\u09a8 \u09ab\u09c7\u0987\u09b8\u09ac\u09c1\u0995 \u0986\u09b0 \u0987\u09a8\u09cd\u09b8\u099f\u09be\u0997\u09cd\u09b0\u09be\u09ae\u09c7  \u09b0\u09bf\u09b2\u09b8 \u09a6\u09c7\u0996\u09c7 \u0995\u09a5\u09bf\u09a4 \u09b8\u09c7\u09b2\u09bf\u09ac\u09cd\u09b0\u09c7\u099f\u09bf \u09a8\u09be\u09ae\u0995 \u0985\u09ae\u09c1\u0995 \u0997\u09be\u09df\u09bf\u0995\u09be \u0986\u09b0 \u09a4\u09ae\u09c1\u0995 \u09a8\u09be\u09df\u09bf\u0995\u09be\u09b0 \u09ac\u09bf\u09df\u09c7 \u0986\u09b0 \u09a1\u09bf\u09ad\u09cb\u09b0\u09cd\u09b8 \u09b9\u09df\u09c7\u099b\u09c7 \u09ac\u09b2\u09c7 \u09ab\u09c1\u099f\u09cb \u09a4\u09be\u09b2\u09be\u09b6\u09c7 \u09ac\u09cd\u09af\u09b8\u09cd\u09a4, \u0986\u09b0  \u09af\u09a4\u09cd\u09b0\u09a4\u09a4\u09cd\u09b0 \u09ac\u09df\u09be\u09a8 \u09a6\u09c7\u09df\u09be\u09df \u09a4\u09cd\u09b0\u09b8\u09cd\u09a4 \u09a4\u0996\u09a8 \u098f\u09b8\u09ac \u09aa\u09cd\u09b0\u09a4\u09bf\u09ad\u09be\u09b0\u09be \u09ae\u09be\u09a8\u09ac \u099c\u0997\u09a4\u09c7\u09b0 \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be \u0987\u09a4\u09bf\u09b9\u09be\u09b8\u0987 \u09aa\u09be\u09b2\u09cd\u099f\u09c7 \u09a6\u09bf\u099a\u09cd\u099b\u09c7\u09a8! ", "subgroup": "Books & Notes"}, {"title": "0004 03", "sub": "PDF Document", "type": "document", "document_type": "pdf", "file": "0004_03.pdf", "src": "documents/0004_03.pdf", "thumbnail": "documents/0004_03.jpg", "subgroup": "Official"}]}</script>
<script>
(function(){
  // Background music starts muted. The button toggles mute/unmute; unmuting
  // also starts playback when the visitor has not started the track yet.
  var bgAudio = document.getElementById('bgAudio');
  var navAudioBtn = document.getElementById('navAudioBtn');
  var navAudioLabel = document.getElementById('navAudioLabel');
  function updateMusicToggle(){
    var muted = bgAudio.muted || bgAudio.paused;
    // A paused track is reported as Muted until the user starts it.
    navAudioLabel.textContent = bgAudio.muted ? 'Muted' : (bgAudio.paused ? 'Ready' : 'Playing');
    navAudioBtn.textContent = bgAudio.muted ? 'Unmute' : 'Mute';
    navAudioBtn.setAttribute('aria-pressed', bgAudio.muted ? 'false' : 'true');
  }
  bgAudio.muted = true;
  updateMusicToggle();
  navAudioBtn.addEventListener('click', function(){
    if (bgAudio.muted) {
      bgAudio.muted = false;
      var playPromise = bgAudio.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(updateMusicToggle).catch(function(){
          bgAudio.muted = true;
          updateMusicToggle();
        });
      } else {
        updateMusicToggle();
      }
    } else {
      bgAudio.muted = true;
      updateMusicToggle();
    }
  });
  bgAudio.addEventListener('play', updateMusicToggle);
  bgAudio.addEventListener('pause', updateMusicToggle);
  bgAudio.addEventListener('volumechange', updateMusicToggle);

  var ALL = JSON.parse(document.getElementById('slidesData').textContent);
  var hero = ALL.find(function(s){ return s.hero; });
  var everything = ALL.filter(function(s){ return !s.hero; }); // photos + videos + documents, unfiltered
  var hierarchy = JSON.parse(document.getElementById('hierarchyData').textContent || '{}');
  var typeFilter = 'all'; // 'all' | 'photo' | 'video' | 'document'
  var subgroupFilter = null;
  var visible = everything.slice(); // currently displayed (after type filter + subgroup + search)

  // ---------- Invitation banner ----------
  var inviteBanner = document.getElementById('inviteBanner');
  var landingProfile = document.getElementById('landingProfile');
  if (hero){
    var heroImg = document.createElement('img');
    heroImg.src = hero.src; heroImg.alt = hero.title || 'Invitation';
    heroImg.addEventListener('click', function(){ openLightbox(hero, -1); });
    inviteBanner.appendChild(heroImg);
  }

  // ---------- Landing-page profile images ----------
  var profileImages = JSON.parse(document.getElementById('profileData').textContent || '[]');
  var profileGrid = document.getElementById('landingProfileGrid');
  if (profileGrid) {
    profileImages.forEach(function(item){
      var figure = document.createElement('figure');
      figure.className = 'landing-profile-card';

      var img = document.createElement('img');
      img.src = item.src;
      img.alt = item.title || 'Profile photo';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.tabIndex = 0;
      img.setAttribute('role', 'button');
      img.setAttribute('aria-label', 'Zoom profile photo: ' + (item.title || 'Profile photo'));
      img.addEventListener('click', function(){ openProfileZoom(item.src, item.title || 'Profile photo'); });
      img.addEventListener('keydown', function(event){
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openProfileZoom(item.src, item.title || 'Profile photo');
        }
      });

      var caption = document.createElement('figcaption');
      caption.textContent = item.title || '';

      figure.appendChild(img);
      if (item.title) figure.appendChild(caption);
      profileGrid.appendChild(figure);
    });
  }


  // ---------- Profile photo zoom controls ----------
  var profileZoom = document.getElementById('profileZoom');
  var profileZoomImage = document.getElementById('profileZoomImage');
  var profileZoomCaption = document.getElementById('profileZoomCaption');
  var profileZoomClose = document.getElementById('profileZoomClose');
  var profileZoomPreviousFocus = null;

  function openProfileZoom(src, caption){
    if (!profileZoom || !profileZoomImage) return;
    profileZoomPreviousFocus = document.activeElement;
    profileZoomImage.src = src;
    profileZoomImage.alt = caption || 'Profile photo';
    profileZoomCaption.textContent = caption || '';
    profileZoom.classList.add('open');
    profileZoom.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    profileZoomClose.focus();
  }

  function closeProfileZoom(){
    if (!profileZoom || !profileZoom.classList.contains('open')) return;
    profileZoom.classList.remove('open');
    profileZoom.setAttribute('aria-hidden', 'true');
    profileZoomImage.src = '';
    profileZoomCaption.textContent = '';
    document.body.style.overflow = '';
    if (profileZoomPreviousFocus && typeof profileZoomPreviousFocus.focus === 'function') {
      profileZoomPreviousFocus.focus();
    }
  }

  profileZoomClose.addEventListener('click', closeProfileZoom);
  profileZoom.addEventListener('click', function(event){
    if (event.target === profileZoom || event.target === profileZoomImage) closeProfileZoom();
  });
  document.addEventListener('keydown', function(event){
    if (event.key === 'Escape') closeProfileZoom();
  });

  // ---------- Gallery rendering ----------
  var gallery = document.getElementById('gallery');
  var searchCount = document.getElementById('searchCount');

  function renderGallery(){
    gallery.innerHTML = '';
    if (visible.length === 0){
      var msg = document.createElement('div');
      msg.className = 'no-results';
      msg.textContent = 'Nothing matches here.';
      gallery.appendChild(msg);
      return;
    }
    visible.forEach(function(s, i){
      var card = document.createElement('div');
      card.className = 'card';
      var thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';
      if (s.type === 'document'){
        card.classList.add('document-card');
        var docIcon = document.createElement('div');
        docIcon.className = 'document-thumb';
        var docLabel = s.document_type === 'text' ? 'TXT' : 'PDF';
        docIcon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h5M9 13h6M9 17h6"/></svg><span>' + docLabel + '</span>';
        if (s.thumbnail){
          var cover = document.createElement('img');
          cover.className = 'document-cover';
          cover.src = s.thumbnail;
          cover.alt = (s.title || s.file || 'Document') + ' cover';
          cover.loading = 'lazy';
          cover.onerror = function(){ cover.replaceWith(docIcon); };
          thumbWrap.appendChild(cover);
        } else {
          thumbWrap.appendChild(docIcon);
        }
      } else if (s.type === 'video'){
        card.classList.add('video-card');
        if (s.poster){
          var vimg = document.createElement('img');
          vimg.src = s.poster; vimg.alt = s.title || ''; vimg.loading = 'lazy';
          thumbWrap.appendChild(vimg);
        } else {
          var vprev = document.createElement('video');
          vprev.src = s.src; vprev.muted = true; vprev.preload = 'metadata'; vprev.playsInline = true;
          thumbWrap.appendChild(vprev);
        }
        var badge = document.createElement('div');
        badge.className = 'play-badge';
        badge.innerHTML = '<span class="circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>';
        thumbWrap.appendChild(badge);
      } else {
        var img = document.createElement('img');
        img.src = s.src; img.alt = s.title || ''; img.loading = 'lazy';
        thumbWrap.appendChild(img);
      }
      if (s.file){
        var fileTag = document.createElement('span');
        fileTag.className = 'file-tag';
        fileTag.textContent = s.file;
        thumbWrap.appendChild(fileTag);
      }
      var cap = document.createElement('div');
      cap.className = 'card-cap';
      var t = document.createElement('p'); t.className = 'card-title'; t.textContent = s.title || '';
      var sub = document.createElement('p'); sub.className = 'card-sub'; sub.textContent = s.sub || '';
      cap.appendChild(t); cap.appendChild(sub);
      card.appendChild(thumbWrap); card.appendChild(cap);
      card.addEventListener('click', function(){
        if (s.type === 'document'){
          if (s.document_type === 'text'){
            textTitle.textContent = s.title || s.file || 'Document';
            documentText.textContent = s.text || '';
            textModal.classList.add('open');
            textModal.setAttribute('aria-hidden', 'false');
          } else {
            pdfTitle.textContent = s.title || s.file || 'Document';
            pdfFrame.src = s.src;
            pdfModal.classList.add('open');
            pdfModal.setAttribute('aria-hidden', 'false');
          }
        } else {
          openLightbox(s, i);
        }
      });
      gallery.appendChild(card);
    });
  }

  // ---------- Search + type filter (combined) ----------
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');

  function applyFilters(){
    var q = searchInput.value.trim().toLowerCase();
    searchClear.style.display = q ? 'block' : 'none';

    var base = everything;
    if (typeFilter === 'photo') base = base.filter(function(s){ return !s.type || s.type === 'photo'; });
    else if (typeFilter === 'video') base = base.filter(function(s){ return s.type === 'video'; });
    else if (typeFilter === 'document') base = base.filter(function(s){ return s.type === 'document'; });
    if (subgroupFilter) base = base.filter(function(s){ return (s.type || 'photo') === typeFilter && s.subgroup === subgroupFilter; });

    if (!q){
      visible = base.slice();
      searchCount.textContent = '';
    } else {
      visible = base.filter(function(s){
        return ((s.title || '') + ' ' + (s.sub || '')).toLowerCase().indexOf(q) !== -1;
      });
      searchCount.textContent = visible.length + (visible.length === 1 ? ' result found' : ' results found');
    }
    renderGallery();
  }
  searchInput.addEventListener('input', applyFilters);
  searchClear.addEventListener('click', function(){ searchInput.value = ''; applyFilters(); searchInput.focus(); });

  // ---------- Nav drawer: open/close ----------
  var navToggle = document.getElementById('navToggle');
  var navDrawer = document.getElementById('navDrawer');
  var navOverlay = document.getElementById('navOverlay');
  var navClose = document.getElementById('navClose');

  var mainContent = document.getElementById('mainContent');

  // ---------- Navigation / landing-page visibility ----------
  // Initial state: landing page is visible; Search + Gallery are hidden.
  function openDrawer(){
    // Opening the menu does NOT reveal Search + Gallery.
    if (mainContent) mainContent.classList.remove('visible');
    if (inviteBanner) inviteBanner.style.display = 'block';
    if (landingProfile) landingProfile.style.display = 'block';
    navDrawer.classList.add('open');
    navOverlay.classList.add('open');
  }

  // Close only the drawer. Used after selecting Browse/Photos/Videos/Documents.
  function closeDrawer(){
    navDrawer.classList.remove('open');
    navOverlay.classList.remove('open');
  }

  // Menu selection: hide landing banner and reveal Search + Gallery.
  function showGallery(){
    if (mainContent) mainContent.classList.add('visible');
    if (inviteBanner) inviteBanner.style.display = 'none';
    if (landingProfile) landingProfile.style.display = 'none';
    closeDrawer();
  }

  // Close (X) or overlay: return completely to the landing page.
  function closeNavToLanding(){
    closeDrawer();
    if (mainContent) mainContent.classList.remove('visible');
    if (inviteBanner) inviteBanner.style.display = 'block';
    if (landingProfile) landingProfile.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  navToggle.addEventListener('click', openDrawer);
  navClose.addEventListener('click', closeNavToLanding);
  navOverlay.addEventListener('click', closeNavToLanding);

  // ---------- More: Our Story / Documents ----------
  var moreData = JSON.parse(document.getElementById('moreData').textContent);
  var ourStoryBtn = document.getElementById('ourStoryBtn');
  var documentsBtn = document.getElementById('documentsBtn');
  var moreSection = document.getElementById('moreSection');
  var storyModal = document.getElementById('storyModal');
  var pdfModal = document.getElementById('pdfModal');
  var storyText = document.getElementById('storyText');
  var pdfFrame = document.getElementById('pdfFrame');
  var pdfTitle = document.getElementById('pdfTitle');
  var textModal = document.getElementById('textModal');
  var textTitle = document.getElementById('textTitle');
  var documentText = document.getElementById('documentText');

  var hasStory = typeof moreData.story === 'string' && moreData.story.trim() !== '';
  var documents = Array.isArray(moreData.documents) ? moreData.documents : [];

  if (!hasStory) {
    ourStoryBtn.style.display = 'none';
  } else {
    storyText.textContent = moreData.story;
  }

  if (!documents.length) {
    documentsBtn.style.display = 'none';
  } else {
    document.getElementById('countDocuments').textContent = documents.length;
  }

  // ---------- More: Audio files and hierarchy-driven subgroups ----------
  var audioFiles = [];
  try {
    audioFiles = JSON.parse(document.getElementById('audioData').textContent || '[]');
  } catch (e) { audioFiles = []; }
  audioFiles = audioFiles.filter(function(item){
    return item && item.file && item.file.toLowerCase() !== 'background.mp3';
  });
  var audioFilesBtn = document.getElementById('audioFilesBtn');
  var audioFilesModal = document.getElementById('audioFilesModal');
  var audioFileList = document.getElementById('audioFileList');
  var audioFilePlayer = document.getElementById('audioFilePlayer');
  document.getElementById('countAudioFiles').textContent = audioFiles.length;

  function renderAudioFiles(subgroupName){
    audioFileList.innerHTML = '';
    var selectedFiles = subgroupName
      ? audioFiles.filter(function(item){ return item.subgroup === subgroupName; })
      : audioFiles;
    selectedFiles.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'audio-file-item';
      var details = document.createElement('div');
      details.className = 'audio-file-details';
      var name = document.createElement('span');
      name.className = 'audio-file-name';
      name.textContent = item.file;
      details.appendChild(name);
      if (item.caption && item.caption.trim()) {
        var caption = document.createElement('span');
        caption.className = 'audio-file-caption';
        caption.textContent = item.caption;
        details.appendChild(caption);
      }
      var play = document.createElement('button');
      play.type = 'button';
      play.textContent = 'Play';
      play.setAttribute('aria-label', 'Play ' + item.file);
      play.addEventListener('click', function(){
        audioFilePlayer.src = item.src;
        audioFilePlayer.style.display = 'block';
        audioFilePlayer.play().catch(function(){});
        audioFilesModal.querySelectorAll('.audio-file-item button').forEach(function(button){ button.textContent = 'Play'; });
        play.textContent = 'Playing';
      });
      row.appendChild(details);
      row.appendChild(play);
      audioFileList.appendChild(row);
    });
    if (!selectedFiles.length) {
      var empty = document.createElement('p');
      empty.className = 'audio-file-caption';
      empty.textContent = 'No audio files in this subgroup yet.';
      audioFileList.appendChild(empty);
    }
    document.querySelector('#audioFilesModal h2').textContent = subgroupName ? 'Audio Files — ' + subgroupName : 'Audio Files';
  }

  var audioSubgroups = document.getElementById('audioSubgroups');
  var audioHierarchy = Array.isArray(hierarchy.audio) ? hierarchy.audio : [];
  var audioNames = audioHierarchy.map(function(item){ return item.name; });
  if (audioFiles.some(function(item){ return !audioNames.includes(item.subgroup); }) && !audioNames.includes('Uncategorized')) {
    audioNames.push('Uncategorized');
  }
  audioNames.forEach(function(name){
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'nav-subgroup';
    var label = document.createElement('span');
    label.textContent = name;
    var count = document.createElement('span');
    count.className = 'sub-count';
    count.textContent = audioFiles.filter(function(item){ return item.subgroup === name; }).length;
    button.appendChild(label);
    button.appendChild(count);
    button.addEventListener('click', function(){
      renderAudioFiles(name);
      openInfoModal(audioFilesModal);
    });
    audioSubgroups.appendChild(button);
  });
  if (!audioFiles.length) {
    audioFilesBtn.style.display = 'none';
    audioSubgroups.style.display = 'none';
  } else {
    audioFilesBtn.addEventListener('click', function(){
      renderAudioFiles(null);
      openInfoModal(audioFilesModal);
    });
  }

  // ---------- More: External links (supports any number of configured URLs) ----------
  var externalLinks = [];
  try {
    externalLinks = JSON.parse(document.getElementById('externalLinksData').textContent || '[]');
  } catch (e) { externalLinks = []; }
  externalLinks = externalLinks.filter(function(item) {
    return item && typeof item.title === 'string' && item.title.trim() &&
      typeof item.url === 'string' && /^https?:\/\//i.test(item.url.trim());
  });
  var externalLinksBtn = document.getElementById('externalLinksBtn');
  var externalLinksModal = document.getElementById('externalLinksModal');
  var externalLinkList = document.getElementById('externalLinkList');
  document.getElementById('countExternalLinks').textContent = externalLinks.length;
  if (!externalLinks.length) {
    externalLinksBtn.style.display = 'none';
  } else {
    externalLinks.forEach(function(item) {
      var link = document.createElement('a');
      link.className = 'external-link-card';
      link.href = item.url.trim();
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      var icon = document.createElement('span');
      icon.className = 'external-link-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '↗';
      var copy = document.createElement('span');
      copy.className = 'external-link-copy';
      var title = document.createElement('span');
      title.className = 'external-link-title';
      title.textContent = item.title.trim();
      copy.appendChild(title);
      if (item.description && String(item.description).trim()) {
        var description = document.createElement('span');
        description.className = 'external-link-description';
        description.textContent = String(item.description).trim();
        copy.appendChild(description);
      }
      var arrow = document.createElement('span');
      arrow.className = 'external-link-arrow';
      arrow.textContent = '↗';
      arrow.setAttribute('aria-hidden', 'true');
      link.appendChild(icon);
      link.appendChild(copy);
      link.appendChild(arrow);
      externalLinkList.appendChild(link);
    });
    externalLinksBtn.addEventListener('click', function() { openInfoModal(externalLinksModal); });
  }


  function openInfoModal(modal){
    closeDrawer();
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
  }

  ourStoryBtn.addEventListener('click', function(){ if (hasStory) openInfoModal(storyModal); });

  // ---------- More modal close buttons ----------
  document.querySelectorAll('.info-modal-close').forEach(function(button){
    button.addEventListener('click', function(){
      var modalId = button.getAttribute('data-modal');
      var modal = document.getElementById(modalId);
      if (!modal) return;
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');

      // Stop the PDF from continuing to load/play in the background.
      if (modalId === 'pdfModal') {
        pdfFrame.removeAttribute('src');
      }
      if (modalId === 'textModal') {
        documentText.textContent = '';
      }
      if (modalId === 'audioFilesModal') {
        audioFilePlayer.pause();
        audioFilePlayer.removeAttribute('src');
        audioFilePlayer.load();
        audioFilePlayer.style.display = 'none';
      }
    });
  });

  // ---------- Nav drawer: main filters + hierarchy-driven subgroups ----------
  var filterButtons = {
    all: document.getElementById('filterAll'),
    photo: document.getElementById('filterPhotos'),
    video: document.getElementById('filterVideos'),
    document: document.getElementById('documentsBtn')
  };
  var photoCount = everything.filter(function(s){ return !s.type || s.type === 'photo'; }).length;
  var videoCount = everything.filter(function(s){ return s.type === 'video'; }).length;
  var documentCount = everything.filter(function(s){ return s.type === 'document'; }).length;
  document.getElementById('countAll').textContent = everything.length;
  document.getElementById('countPhotos').textContent = photoCount;
  document.getElementById('countVideos').textContent = videoCount;
  document.getElementById('countDocuments').textContent = documentCount;
  if (photoCount === 0) filterButtons.photo.style.display = 'none';
  if (videoCount === 0) filterButtons.video.style.display = 'none';
  if (documentCount === 0) filterButtons.document.style.display = 'none';

  function mediaTypeItems(type){
    return everything.filter(function(s){ return (s.type || 'photo') === type; });
  }
  function setMainFilter(type){
    typeFilter = type;
    subgroupFilter = null;
    Object.keys(filterButtons).forEach(function(k){
      filterButtons[k].classList.toggle('active', k === type);
    });
    document.querySelectorAll('.nav-subgroup').forEach(function(btn){ btn.classList.remove('active'); });
    applyFilters();
    showGallery();
  }
  function buildSubgroups(type, containerId){
    var container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    var items = mediaTypeItems(type);
    var configured = Array.isArray(hierarchy[type]) ? hierarchy[type] : [];
    var names = configured.map(function(item){ return item.name; });
    if (items.some(function(item){ return !names.includes(item.subgroup); }) && !names.includes('Uncategorized')) names.push('Uncategorized');
    names.forEach(function(name){
      var count = items.filter(function(item){ return item.subgroup === name; }).length;
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'nav-subgroup';
      button.dataset.mediaType = type;
      button.dataset.subgroup = name;
      var label = document.createElement('span');
      label.textContent = name;
      var countLabel = document.createElement('span');
      countLabel.className = 'sub-count';
      countLabel.textContent = count;
      button.appendChild(label);
      button.appendChild(countLabel);
      button.addEventListener('click', function(){
        typeFilter = type;
        subgroupFilter = name;
        Object.keys(filterButtons).forEach(function(k){ filterButtons[k].classList.toggle('active', false); });
        document.querySelectorAll('.nav-subgroup').forEach(function(other){ other.classList.toggle('active', other === button); });
        applyFilters();
        showGallery();
      });
      container.appendChild(button);
    });
  }
  buildSubgroups('photo', 'photoSubgroups');
  buildSubgroups('video', 'videoSubgroups');
  buildSubgroups('document', 'documentSubgroups');

  // Subgroups for Photos, Videos and Documents stay visible at all times.
  // Clicking a main category filters its files without collapsing any subgroup list.
  Object.keys(filterButtons).forEach(function(key){
    filterButtons[key].addEventListener('click', function(){
      setMainFilter(key);
    });
  });

})();
</script>
</body>
</html>
