<script type="application/json" id="moreData">{"story":"","documents":[{"title": "0001 01", "sub": "Text Document", "type": "document", "document_type": "text", "file": "0001_01.txt", "src": "documents/0001_01.txt", "thumbnail": "documents/0001_01.jpg", "text": "\n\u09e7\u09e6\u09e6\u099f\u09bf '\u09a8\u09be'-\u098f\u09b0 \u09b6\u0995\u09cd\u09a4\u09bf - \u098f\u0995\u099f\u09bf \u09b8\u09a4\u09cd\u09af\u09bf \u099c\u09c0\u09ac\u09a8\u09c7\u09b0 \u09b6\u09bf\u0995\u09cd\u09b7\u09be\n\u0997\u09a4\u0995\u09be\u09b2 \u0986\u09ae\u09be\u09b0 \u099b\u09c7\u09b2\u09c7 \u09ac\u09bf\u09b6\u09be\u09b2\u09c7\u09b0 \u09ab\u09cb\u09a8 \u098f\u09b8\u09c7\u099b\u09bf\u09b2\u0964 \u0993 \u0986\u099c\u0995\u09be\u09b2 \u0987\u0989\u09b0\u09cb\u09aa\u09c7 \u09a5\u09be\u0995\u09c7\u0964 \u0993 \u0986\u09ae\u09be\u0995\u09c7 \u098f\u09ae\u09a8 \u098f\u0995\u099f\u09bf \u0997\u09b2\u09cd\u09aa \u09b6\u09cb\u09a8\u09be\u09b2 \u09af\u09be \u09b6\u09c1\u09a8\u09c7 \u0986\u09ae\u09bf \u0985\u09a8\u09c7\u0995\u0995\u09cd\u09b7\u09a3 \u09a7\u09b0\u09c7 \u09ad\u09be\u09ac\u09a4\u09c7 \u09ac\u09be\u09a7\u09cd\u09af \u09b9\u09b2\u09be\u09ae\u0964 \u09ae\u09a8\u09c7 \u09b9\u09b2\u09cb \u098f\u099f\u09be \u09b6\u09c1\u09a7\u09c1 \u098f\u0995\u099f\u09be \u0997\u09b2\u09cd\u09aa \u09a8\u09df, \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09b8\u09ac\u09be\u09b0 \u099c\u09c0\u09ac\u09a8\u09c7\u09b0 \u098f\u0995\u099f\u09be \u0986\u09df\u09a8\u09be\u0964\n\u09ac\u09bf\u09b6\u09be\u09b2 \u0986\u09ae\u09b8\u09cd\u099f\u09be\u09b0\u09a1\u09be\u09ae\u09c7\u09b0 \u098f\u0995\u099f\u09bf Costco \u09b8\u09cd\u099f\u09cb\u09b0\u09c7 \u0997\u09bf\u09df\u09c7\u099b\u09bf\u09b2\u0964 \u09ac\u09be\u0987\u09b0\u09c7 \u09ac\u09c7\u09b6 \u09a0\u09be\u09a8\u09cd\u09a1\u09be \u099b\u09bf\u09b2, \u09ae\u09be\u09a8\u09c1\u09b7\u099c\u09a8 \u09a4\u09be\u09dc\u09be\u09a4\u09be\u09dc\u09bf \u0986\u09b8\u09be- \u09af\u09be\u0993\u09df\u09be \u0995\u09b0\u099b\u09bf\u09b2\u0964\n\u0997\u09c7\u099f\u09c7\u09b0 \u0995\u09be\u099b\u09c7 \u098f\u0995\u099f\u09bf \u099b\u09cb\u099f \u09b6\u09bf\u09b6\u09c1 \u09a6\u09be\u0981\u09dc\u09bf\u09df\u09c7 \u099b\u09bf\u09b2\u0964 \u09ac\u09df\u09b8 \u09ac\u09dc\u099c\u09cb\u09b0 \u09aa\u09be\u0981\u099a \u09ac\u099b\u09b0 \u09b9\u09ac\u09c7\u0964 \u09b9\u09be\u09a4\u09c7 \u099a\u09bf\u09aa\u09b8\u09c7\u09b0 \u0995\u09bf\u099b\u09c1 \u09aa\u09cd\u09af\u09be\u0995\u09c7\u099f \u0986\u09b0 \u0997\u09b2\u09be\u09df \u099d\u09c1\u09b2\u099b\u09bf\u09b2 \u098f\u0995\u099f\u09bf \u099b\u09cb\u099f \u09ac\u09cb\u09b0\u09cd\u09a1\u0964 \u09ac\u09cb\u09b0\u09cd\u09a1\u09c7 \u0986\u0981\u0995\u09be\u09ac\u09be\u0981\u0995\u09be \u0985\u0995\u09cd\u09b7\u09b0\u09c7 \u09b2\u09c7\u0996\u09be \u099b\u09bf\u09b2 - \"\u09b8\u09cd\u0995\u09be\u0989\u099f \u099a\u09cd\u09af\u09be\u09b0\u09bf\u099f\u09bf\u09b0 \u099c\u09a8\u09cd\u09af, \u09ae\u09be\u09a4\u09cd\u09b0 \u09e8\u09e6 \u0987\u0989\u09b0\u09cb\u0964\"\n\u09ae\u09be\u09a8\u09c1\u09b7\u099c\u09a8 \u09a4\u09be\u09b0 \u09aa\u09be\u09b6 \u09a6\u09bf\u09df\u09c7 \u099a\u09b2\u09c7 \u09af\u09be\u099a\u09cd\u099b\u09bf\u09b2\u0964 \u0995\u09be\u09b0\u0993 \u09a4\u09be\u09dc\u09be \u099b\u09bf\u09b2, \u0995\u09c7\u0989 \u09ab\u09cb\u09a8\u09c7 \u09ac\u09cd\u09af\u09b8\u09cd\u09a4 \u099b\u09bf\u09b2, \u0986\u09ac\u09be\u09b0 \u0995\u09c7\u0989 \u09a6\u09c7\u0996\u09c7\u0993 \u09a8\u09be \u09a6\u09c7\u0996\u09be\u09b0 \u09ad\u09be\u09a8 \u0995\u09b0\u099b\u09bf\u09b2\u0964\n\u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09b8\u09c7\u0987 \u09b6\u09bf\u09b6\u09c1\u099f\u09bf... \u09b8\u09c7 \u09b9\u09be\u09b0 \u09ae\u09be\u09a8\u099b\u09bf\u09b2 \u09a8\u09be\u0964\n\u09b8\u09c7 \u09a4\u09be\u09b0 \u099b\u09cb\u099f \u099b\u09cb\u099f \u09aa\u09be\u09df\u09c7 \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09be \u09aa\u09a5\u099a\u09be\u09b0\u09c0\u09b0 \u0995\u09be\u099b\u09c7 \u09af\u09c7\u09a4, \u09ae\u09c1\u0996\u09c7\u09b0 \u09a6\u09bf\u0995\u09c7 \u09a4\u09be\u0995\u09be\u09a4 \u0986\u09b0 \u0996\u09c1\u09ac \u09a8\u09bf\u09b7\u09cd\u09aa\u09be\u09aa\u09ad\u09be\u09ac\u09c7 \u099c\u09bf\u099c\u09cd\u099e\u09be\u09b8\u09be \u0995\u09b0\u09a4, \"\u0986\u09aa\u09a8\u09bf \u0995\u09bf \u098f\u0995\u099f\u09be \u09aa\u09cd\u09af\u09be\u0995\u09c7\u099f \u0995\u09bf\u09a8\u09ac\u09c7\u09a8?\"\n\u0995\u09c7\u0989 \u09b9\u09df\u09a4\u09cb \u0995\u09bf\u09a8\u09c7 \u09a8\u09bf\u09a4, \u0986\u09ac\u09be\u09b0 \u0995\u09c7\u0989 \u09b9\u09c7\u09b8\u09c7 \u09ac\u09b2\u09a4, \"\u09a8\u09be \u09ac\u09be\u09ac\u09be, \u09a7\u09a8\u09cd\u09af\u09ac\u09be\u09a6\u0964\"\n\u0986\u09ae\u09bf \u09ad\u09be\u09ac\u099b\u09bf\u09b2\u09be\u09ae, \u098f\u09a4 \u099b\u09cb\u099f \u098f\u0995\u099f\u09be \u09ac\u09be\u099a\u09cd\u099a\u09be, \u098f\u09a4\u09ac\u09be\u09b0 '\u09a8\u09be' \u09b6\u09c1\u09a8\u09c7 \u09b9\u09df\u09a4\u09cb \u0995\u09c7\u0981\u09a6\u09c7 \u09ab\u09c7\u09b2\u09ac\u09c7, \u09ae\u09a8 \u0996\u09be\u09b0\u09be\u09aa \u0995\u09b0\u09c7 \u09a4\u09be\u09b0 \u09b6\u09bf\u0995\u09cd\u09b7\u0995\u09c7\u09b0 \u09aa\u09c7\u099b\u09a8\u09c7 \u0997\u09bf\u09df\u09c7 \u09b2\u09c1\u0995\u09be\u09ac\u09c7\u0964\n\u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09a8\u09be\u0964\n\u09b8\u09c7 \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09be '\u09a8\u09be'-\u098f\u09b0 \u09aa\u09b0 \u09b9\u09be\u09b8\u09a4, \u0986\u09b2\u09a4\u09cb \u0995\u09b0\u09c7 \u09ae\u09be\u09a5\u09be \u09a8\u09be\u09dc\u09be\u09a4 \u0986\u09b0 \u09aa\u09b0\u09c7\u09b0 \u09ae\u09be\u09a8\u09c1\u09b7\u099f\u09bf\u09b0 \u09a6\u09bf\u0995\u09c7 \u098f\u0997\u09bf\u09df\u09c7 \u09af\u09c7\u09a4\u0964 \u09a4\u09be\u09b0 \u09ae\u09c1\u0996\u09c7 \u0995\u09cb\u09a8\u09cb \u09b2\u099c\u09cd\u099c\u09be \u099b\u09bf\u09b2 \u09a8\u09be, \u09ad\u09df \u099b\u09bf\u09b2 \u09a8\u09be, \u0995\u09cb\u09a8\u09cb \u09b9\u09a4\u09be\u09b6\u09be\u0993 \u099b\u09bf\u09b2 \u09a8\u09be\u0964 \u099b\u09bf\u09b2 \u09b6\u09c1\u09a7\u09c1 \u098f\u0995 \u0985\u09a6\u09cd\u09ad\u09c1\u09a4 \u0986\u09a4\u09cd\u09ae\u09ac\u09bf\u09b6\u09cd\u09ac\u09be\u09b8\u0964\n\u09ac\u09bf\u09b6\u09be\u09b2 \u0986\u09b0 \u09a5\u09be\u0995\u09a4\u09c7 \u09a8\u09be \u09aa\u09c7\u09b0\u09c7 \u098f\u0995\u099f\u09be \u09aa\u09cd\u09af\u09be\u0995\u09c7\u099f \u0995\u09bf\u09a8\u09c7 \u09a8\u09bf\u09b2\u0964 \u09ac\u09be\u099a\u09cd\u099a\u09be\u099f\u09be\u09b0 \u099a\u09cb\u0996\u09a6\u09c1\u099f\u09cb \u0989\u099c\u09cd\u099c\u09cd\u09ac\u09b2 \u09b9\u09df\u09c7 \u0989\u09a0\u09b2\u0964 \u09b8\u09c7 \u09b2\u09be\u09ab\u09bf\u09df\u09c7 \u0989\u09a0\u09c7 \u09ac\u09b2\u09b2, \"\u0986\u09aa\u09a8\u09be\u0995\u09c7 \u0985\u09a8\u09c7\u0995 \u09a7\u09a8\u09cd\u09af\u09ac\u09be\u09a6!\"\n\u09a4\u09be\u09b0\u09aa\u09b0 \u09ac\u09bf\u09b6\u09be\u09b2 \u09ad\u09be\u09b2\u09cb\u09ac\u09c7\u09b8\u09c7 \u099c\u09bf\u099c\u09cd\u099e\u09be\u09b8\u09be \u0995\u09b0\u09b2, \"\u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u0986\u09b0 \u0995\u099f\u09be \u09aa\u09cd\u09af\u09be\u0995\u09c7\u099f \u09ac\u09bf\u0995\u09cd\u09b0\u09bf \u0995\u09b0\u09a4\u09c7 \u09b9\u09ac\u09c7? \u09a4\u09c1\u09ae\u09bf \u098f\u0996\u09be\u09a8\u09c7 \u0995\u09a4\u0995\u09cd\u09b7\u09a3 \u09a6\u09be\u0981\u09dc\u09bf\u09df\u09c7 \u09a5\u09be\u0995\u09ac\u09c7?\"\n\u09ac\u09be\u099a\u09cd\u099a\u09be\u099f\u09bf \u09af\u09c7 \u0989\u09a4\u09cd\u09a4\u09b0 \u09a6\u09bf\u09b2, \u09a4\u09be \u09ac\u09bf\u09b6\u09be\u09b2\u0995\u09c7 \u09ad\u09c7\u09a4\u09b0 \u09a5\u09c7\u0995\u09c7 \u09a8\u09be\u09dc\u09bf\u09df\u09c7 \u09a6\u09bf\u09b2\u0964\n\u09b8\u09c7 \u09ac\u09b2\u09b2, \"\u09af\u09a4\u0995\u09cd\u09b7\u09a3 \u09a8\u09be \u09e7\u09e6\u09e6 \u099c\u09a8 \u09ae\u09be\u09a8\u09c1\u09b7 \u0986\u09ae\u09be\u0995\u09c7 '\u09a8\u09be' \u09ac\u09b2\u099b\u09c7\u09a8, \u09a4\u09a4\u0995\u09cd\u09b7\u09a3!\"\n\u09ac\u09bf\u09b6\u09be\u09b2 \u0985\u09ac\u09be\u0995 \u09b9\u09df\u09c7 \u0997\u09c7\u09b2\u0964 \u09b8\u09c7 \u09aa\u09be\u09b6\u09c7 \u09a6\u09be\u0981\u09dc\u09bf\u09df\u09c7 \u09a5\u09be\u0995\u09be \u09b6\u09bf\u0995\u09cd\u09b7\u0995\u09c7\u09b0 \u09a6\u09bf\u0995\u09c7 \u09a4\u09be\u0995\u09be\u09b2\u0964 \u09b6\u09bf\u0995\u09cd\u09b7\u0995 \u09b9\u09c7\u09b8\u09c7 \u09ac\u09b2\u09b2\u09c7\u09a8:\n\"\u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u0989\u09a6\u09cd\u09a6\u09c7\u09b6\u09cd\u09af \u09aa\u09cd\u09af\u09be\u0995\u09c7\u099f \u09ac\u09bf\u0995\u09cd\u09b0\u09bf \u0995\u09b0\u09be \u09a8\u09df\u0964 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u0989\u09a6\u09cd\u09a6\u09c7\u09b6\u09cd\u09af \u09b9\u09b2\u09cb \u098f\u0987 \u09ac\u09be\u099a\u09cd\u099a\u09be\u099f\u09bf \u09af\u09c7\u09a8 \u098f\u0987 \u09ac\u09df\u09b8\u09c7\u0987 '\u09a8\u09be' \u09b6\u09c1\u09a8\u09a4\u09c7 \u09b6\u09c7\u0996\u09c7\u0964 '\u09a8\u09be' \u09b6\u09c1\u09a8\u09c7 \u09b8\u09c7\u099f\u09be\u0995\u09c7 \u09b9\u09be\u09b8\u09bf\u09ae\u09c1\u0996\u09c7 \u09ae\u09c7\u09a8\u09c7 \u09a8\u09bf\u09a4\u09c7 \u09b6\u09c7\u0996\u09c7, \u0986\u09b0 \u09a4\u09be\u09b0\u09aa\u09b0\u0993 \u09aa\u09b0\u09c7\u09b0 \u09ae\u09be\u09a8\u09c1\u09b7\u099f\u09bf\u0995\u09c7 \u099c\u09bf\u099c\u09cd\u099e\u09be\u09b8\u09be \u0995\u09b0\u09be\u09b0 \u09b8\u09be\u09b9\u09b8 \u09b0\u09be\u0996\u09c7\u0964\"\n\u09b6\u09c1\u09a8\u09c7 \u09ac\u09bf\u09b6\u09be\u09b2 \u099a\u09c1\u09aa \u09b9\u09df\u09c7 \u0997\u09c7\u09b2\u0964 \u0986\u09ae\u09bf\u0993 \u099a\u09c1\u09aa \u09b9\u09df\u09c7 \u0997\u09c7\u09b2\u09be\u09ae\u0964\n\u0986\u09ae\u09b0\u09be \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09ac\u09be\u099a\u09cd\u099a\u09be\u09a6\u09c7\u09b0 \u0995\u09c0 \u09b6\u09c7\u0996\u09be\u0987?\n\u0996\u09c1\u09ac \u09aa\u09dc\u09be\u09b6\u09cb\u09a8\u09be \u0995\u09b0\u09cb, \u09ab\u09be\u09b0\u09cd\u09b8\u09cd\u099f \u09b9\u0993, \u09aa\u09cd\u09b0\u09a4\u09bf\u09af\u09cb\u0997\u09bf\u09a4\u09be\u09df \u099c\u09c7\u09a4\u09cb, \u09b8\u09bf\u09b2\u09c7\u0995\u09cd\u099f \u09b9\u0993, \u09b8\u09ac\u09be\u09b0 \u0986\u0997\u09c7 \u09a5\u09c7\u0995\u09cb\u0964\n\u0986\u09ae\u09b0\u09be \u09a4\u09be\u09a6\u09c7\u09b0 \u099c\u09bf\u09a4\u09a4\u09c7 \u09b6\u09c7\u0996\u09be\u0987\u0964 \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u0986\u09ae\u09b0\u09be \u09a4\u09be\u09a6\u09c7\u09b0 \u09b9\u09be\u09b0\u09a4\u09c7 \u09b6\u09c7\u0996\u09be\u0987 \u09a8\u09be\u0964\n\u0986\u09ae\u09b0\u09be \u09a4\u09be\u09a6\u09c7\u09b0 \u09b8\u09be\u09ab\u09b2\u09cd\u09af\u09c7\u09b0 \u09b0\u09be\u09b8\u09cd\u09a4\u09be \u09a6\u09c7\u0996\u09be\u0987, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09ac\u09cd\u09af\u09b0\u09cd\u09a5\u09a4\u09be\u09b0 \u09ae\u09a7\u09cd\u09af \u09a6\u09bf\u09df\u09c7 \u09af\u09be\u0993\u09df\u09be\u09b0 \u09b8\u09be\u09b9\u09b8 \u09a6\u09bf\u0987 \u09a8\u09be\u0964\n\u0985\u09a5\u099a \u099c\u09c0\u09ac\u09a8\u09c7 \u09b8\u09ac\u099a\u09c7\u09df\u09c7 \u09ac\u09c7\u09b6\u09bf \u09aa\u09cd\u09b0\u09df\u09cb\u099c\u09a8 \u098f\u0987 \u09b8\u09be\u09b9\u09b8\u09c7\u09b0\u0987\u0964\n\u0995\u09be\u09b0\u09a3 \u099c\u09c0\u09ac\u09a8 \u09b8\u09ac\u09b8\u09ae\u09df '\u09b9\u09cd\u09af\u09be\u0981' \u09ac\u09b2\u09ac\u09c7 \u09a8\u09be\u0964\n\u0995\u09bf\u099b\u09c1 \u09aa\u09b0\u09c0\u0995\u09cd\u09b7\u09be \u0996\u09be\u09b0\u09be\u09aa \u09b9\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7\u0964 \u0995\u09bf\u099b\u09c1 \u0987\u09a8\u09cd\u099f\u09be\u09b0\u09ad\u09bf\u0989 \u0995\u09cd\u09b2\u09bf\u09af\u09bc\u09be\u09b0 \u09b9\u09ac\u09c7 \u09a8\u09be\u0964 \u0995\u09bf\u099b\u09c1 \u09ac\u09cd\u09af\u09ac\u09b8\u09be \u09ac\u09cd\u09af\u09b0\u09cd\u09a5 \u09b9\u09ac\u09c7\u0964 \u0995\u09bf\u099b\u09c1 \u09b8\u09ae\u09cd\u09aa\u09b0\u09cd\u0995 \u09ad\u09c7\u0999\u09c7 \u09af\u09be\u09ac\u09c7\u0964 \u0995\u09bf\u099b\u09c1 \u09b8\u09cd\u09ac\u09aa\u09cd\u09a8 \u09aa\u09c2\u09b0\u09a3 \u09b9\u09a4\u09c7 \u09b8\u09ae\u09df \u09b2\u09be\u0997\u09ac\u09c7\u0964\n\u09b8\u09c7\u09a6\u09bf\u09a8 \u09af\u09c7 '\u09a8\u09be'-\u098f\u09b0 \u09ae\u09c1\u0996\u09cb\u09ae\u09c1\u0996\u09bf \u09b9\u09a4\u09c7 \u09b9\u09ac\u09c7, \u09a4\u09be \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09ad\u09c7\u0999\u09c7 \u0997\u09c1\u09dc\u09bf\u09df\u09c7 \u09a6\u09bf\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7, \u0986\u09ac\u09be\u09b0 \u0997\u09dc\u09c7\u0993 \u09a4\u09c1\u09b2\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7\u0964 \u09a4\u09ab\u09be\u09a4 \u09b6\u09c1\u09a7\u09c1 \u098f\u0995\u099f\u09be\u0987\u2014\u0986\u09ae\u09b0\u09be \u09b6\u09c8\u09b6\u09ac\u09c7 '\u09a8\u09be'-\u098f\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u09ac\u09a8\u09cd\u09a7\u09c1\u09a4\u09cd\u09ac \u0995\u09b0\u09c7\u099b\u09bf \u09a8\u09be\u0995\u09bf \u09b6\u09a4\u09cd\u09b0\u09c1\u09a4\u09be\u0964\n\u09b8\u09c7\u0987 \u09aa\u09be\u0981\u099a \u09ac\u099b\u09b0\u09c7\u09b0 \u09b6\u09bf\u09b6\u09c1\u099f\u09bf Costco-\u09b0 \u09ac\u09be\u0987\u09b0\u09c7 \u099a\u09bf\u09aa\u09b8 \u09ac\u09bf\u0995\u09cd\u09b0\u09bf \u0995\u09b0\u099b\u09bf\u09b2 \u09a8\u09be\u0964\n\u09b8\u09c7 \u09b8\u09be\u09b9\u09b8 \u09ac\u09bf\u0995\u09cd\u09b0\u09bf \u0995\u09b0\u099b\u09bf\u09b2\u0964 \u09b8\u09c7 '\u09a8\u09be' \u09b8\u0982\u0997\u09cd\u09b0\u09b9 \u0995\u09b0\u099b\u09bf\u09b2\u0964 \u09b8\u09c7 \u09aa\u09cd\u09b0\u09a4\u09cd\u09af\u09be\u0996\u09be\u09a8\u0995\u09c7 \u099c\u09dc\u09bf\u09df\u09c7 \u09a7\u09b0\u09a4\u09c7 \u09b6\u09bf\u0996\u099b\u09bf\u09b2\u0964 \u09b8\u09c7 \u099c\u09c0\u09ac\u09a8\u09c7\u09b0 \u09b8\u09ac\u099a\u09c7\u09df\u09c7 \u09ac\u09dc \u09aa\u09b0\u09c0\u0995\u09cd\u09b7\u09be\u09b0 \u09aa\u09cd\u09b0\u09b8\u09cd\u09a4\u09c1\u09a4\u09bf \u09a8\u09bf\u099a\u09cd\u099b\u09bf\u09b2\u2014\u09aa\u09dc\u09c7 \u0997\u09bf\u09df\u09c7 \u0986\u09ac\u09be\u09b0 \u0989\u09a0\u09c7 \u09a6\u09be\u0981\u09dc\u09be\u09a8\u09cb\u09b0 \u09aa\u09b0\u09c0\u0995\u09cd\u09b7\u09be\u0964\n\u09ad\u09c7\u09ac\u09c7 \u09a6\u09c7\u0996\u09c1\u09a8, \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09b8\u09a8\u09cd\u09a4\u09be\u09a8 \u09af\u09a6\u09bf \u09e7\u09e6\u09ae\u09c7 \u09ab\u09c7\u09b2 \u0995\u09b0\u09c7, \u0986\u09ae\u09b0\u09be \u0995\u09c0 \u0995\u09b0\u09bf? \u09ac\u0995\u09be\u099d\u0995\u09be \u0995\u09b0\u09bf, \u0996\u09cb\u0981\u099f\u09be \u09a6\u09bf\u0987, \u09b2\u099c\u09cd\u099c\u09bf\u09a4 \u09ac\u09cb\u09a7 \u0995\u09b0\u09bf\u0964\n\u09af\u09a6\u09bf \u09b8\u09c7 \u0987\u09a8\u09cd\u099f\u09be\u09b0\u09ad\u09bf\u0989\u09a4\u09c7 \u09ac\u09be\u09a6 \u09aa\u09dc\u09c7, \u0986\u09ae\u09b0\u09be \u09ac\u09b2\u09bf, \"\u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09a6\u09bf\u09df\u09c7 \u0995\u09bf\u099a\u09cd\u099b\u09c1 \u09b9\u09ac\u09c7 \u09a8\u09be\u0964\"\n\u0986\u09ae\u09b0\u09be \u0985\u099c\u09be\u09a8\u09cd\u09a4\u09c7\u0987 \u09a4\u09be\u0995\u09c7 \u09ac\u09c1\u099d\u09bf\u09df\u09c7 \u09a6\u09bf\u0987 \u09af\u09c7 '\u09a8\u09be' \u09ae\u09be\u09a8\u09c7\u0987\u2014\u09a4\u09c1\u09ae\u09bf \u09ac\u09cd\u09af\u09b0\u09cd\u09a5, \u09a4\u09c1\u09ae\u09bf \u09ac\u09c7\u0995\u09be\u09b0\u0964\n\u0985\u09a5\u099a \u09b8\u09c7\u0987 \u09b6\u09bf\u0995\u09cd\u09b7\u0995 \u09b6\u09bf\u0996\u09bf\u09df\u09c7\u099b\u09bf\u09b2\u09c7\u09a8 \u09af\u09c7 '\u09a8\u09be' \u09ae\u09be\u09a8\u09c7 \u09b9\u09b2\u09cb: \"\u098f\u0996\u09a8\u0987 \u09a8\u09df, \u0986\u09ac\u09be\u09b0 \u099a\u09c7\u09b7\u09cd\u099f\u09be \u0995\u09b0\u09cb\u0964\"\n\u09ac\u09a8\u09cd\u09a7\u09c1\u09b0\u09be, \u09b8\u09be\u09ab\u09b2\u09cd\u09af \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u0986\u09a8\u09a8\u09cd\u09a6 \u09a6\u09c7\u09df, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 '\u09a8\u09be' \u09b8\u09be\u09ae\u09b2\u09be\u09a8\u09cb\u09b0 \u0995\u09cd\u09b7\u09ae\u09a4\u09be \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09ac\u09be\u0981\u099a\u09a4\u09c7 \u09b6\u09c7\u0996\u09be\u09df\u0964\n\u0986\u099c \u09a5\u09c7\u0995\u09c7 \u09b8\u09a8\u09cd\u09a4\u09be\u09a8\u09a6\u09c7\u09b0 \u09b6\u09c1\u09a7\u09c1 \u098f\u099f\u09be\u0987 \u099c\u09bf\u099c\u09cd\u099e\u09be\u09b8\u09be \u0995\u09b0\u09ac\u09c7\u09a8 \u09a8\u09be, \"\u09ac\u09be\u09ac\u09be/\u09ae\u09be, \u099c\u09bf\u09a4\u09b2\u09c7 \u09a8\u09be \u09b9\u09be\u09b0\u09b2\u09c7? \u0995\u09a4 \u09a8\u09ae\u09cd\u09ac\u09b0 \u09aa\u09c7\u09b2\u09c7?\"\n\u0995\u0996\u09a8\u0993 \u0995\u0996\u09a8\u0993 \u098f\u099f\u09be\u0993 \u099c\u09bf\u099c\u09cd\u099e\u09be\u09b8\u09be \u0995\u09b0\u09c1\u09a8, \"\u0986\u099c \u0995\u09a4\u09ac\u09be\u09b0 '\u09a8\u09be' \u09b6\u09c1\u09a8\u09b2\u09c7? \u0986\u09b0 \u09a4\u09be\u09b0\u09aa\u09b0\u0993 \u0995\u09bf \u099a\u09c7\u09b7\u09cd\u099f\u09be \u099a\u09be\u09b2\u09bf\u09df\u09c7 \u0997\u09c7\u09b2\u09c7? \u0986\u09ae\u09bf \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09a8\u09bf\u09df\u09c7 \u0997\u09b0\u09cd\u09ac\u09bf\u09a4\u0964\"\n\u098f\u09ae\u09a8 \u09b8\u09a8\u09cd\u09a4\u09be\u09a8 \u0997\u09dc\u09c7 \u09a4\u09c1\u09b2\u09ac\u09c7\u09a8 \u09a8\u09be \u09af\u09c7 \u09b6\u09c1\u09a7\u09c1 \u099c\u09bf\u09a4\u09b2\u09c7\u0987 \u0996\u09c1\u09b6\u09bf \u09b9\u09df\u0964\n\u098f\u09ae\u09a8 \u09b8\u09a8\u09cd\u09a4\u09be\u09a8 \u0997\u09dc\u09c7 \u09a4\u09c1\u09b2\u09c1\u09a8 \u09af\u09c7 \u09b9\u09be\u09b0\u09a4\u09c7 \u09ad\u09df \u09aa\u09be\u09df \u09a8\u09be\u0964\n\u0995\u09be\u09b0\u09a3 \u09af\u09c7 \u099c\u09c7\u09a4\u09c7, \u09b8\u09c7 \u09b9\u09be\u09a4\u09a4\u09be\u09b2\u09bf \u09aa\u09be\u09df; \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09af\u09c7 \u09b9\u09c7\u09b0\u09c7 \u0997\u09bf\u09df\u09c7\u0993 \u0998\u09c1\u09b0\u09c7 \u09a6\u09be\u0981\u09dc\u09be\u09df, \u09b8\u09c7 \u099c\u09c0\u09ac\u09a8\u0995\u09c7 \u099c\u09df \u0995\u09b0\u09c7\u0964\n\u09b8\u09cd\u09af\u09be\u09b2\u09c1\u099f \u09b8\u09c7\u0987 \u099b\u09cb\u099f\u09cd\u099f \u09b6\u09bf\u09b6\u09c1\u099f\u09bf\u0995\u09c7, \u09af\u09c7 \u09e7\u09e6\u09e6\u099f\u09bf '\u09a8\u09be' \u09a6\u09bf\u09df\u09c7 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u099c\u09c0\u09ac\u09a8\u09c7\u09b0 \u09b8\u09ac\u099a\u09c7\u09df\u09c7 \u09ac\u09dc '\u09b9\u09cd\u09af\u09be\u0981' \u09b6\u09bf\u0996\u09bf\u09df\u09c7 \u09a6\u09bf\u09b2\u0964\n\u09af\u09a6\u09bf \u098f\u0987 \u0997\u09b2\u09cd\u09aa\u099f\u09bf \u0986\u09aa\u09a8\u09be\u09b0 \u09b9\u09c3\u09a6\u09df \u099b\u09c1\u0981\u09df\u09c7 \u09a5\u09be\u0995\u09c7, \u09a4\u09ac\u09c7 \u0985\u09ac\u09b6\u09cd\u09af\u0987 \u098f\u09ae\u09a8 \u0995\u09cb\u09a8\u09cb \u09ac\u09be\u09ac\u09be-\u09ae\u09be\u09df\u09c7\u09b0 \u0995\u09be\u099b\u09c7 \u09aa\u09cc\u0981\u099b\u09c7 \u09a6\u09bf\u09a8 \u09af\u09be\u09b0\u09be \u0986\u099c \u09a4\u09be\u09a6\u09c7\u09b0 \u09b8\u09a8\u09cd\u09a4\u09be\u09a8\u09c7\u09b0 \u09b0\u09c7\u099c\u09be\u09b2\u09cd\u099f \u09a8\u09bf\u09df\u09c7 \u099a\u09bf\u09a8\u09cd\u09a4\u09bf\u09a4\u0964 \u09b9\u09df\u09a4\u09cb \u09a4\u09be\u09a6\u09c7\u09b0\u0993 \u098f\u0987 \u0995\u09a5\u09be\u099f\u09bf \u09ae\u09a8\u09c7 \u09aa\u09dc\u09c7 \u09af\u09be\u09ac\u09c7...\n\u0995\u0996\u09a8\u0993 \u0995\u0996\u09a8\u0993 \u09e7\u09e6\u09e6\u099f\u09bf '\u09a8\u09be', \u098f\u0995\u099f\u09bf '\u09b9\u09cd\u09af\u09be\u0981'-\u098f\u09b0 \u099a\u09c7\u09df\u09c7 \u0985\u09a8\u09c7\u0995 \u09ac\u09c7\u09b6\u09bf \u09b6\u09bf\u0996\u09bf\u09df\u09c7 \u09af\u09be\u09df\u0964\n"}, {"title": "0002 01", "sub": "Text Document", "type": "document", "document_type": "text", "file": "0002_01.txt", "src": "documents/0002_01.txt", "thumbnail": "documents/0002_01.jpg", "text": "\u098f\u0995\u0987 \u09a8\u09be\u09b0\u09c0\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7... \u09b8\u09be\u09a4\u09ac\u09be\u09b0 \u2764\ufe0f\n\u200b\u098f\u0995 \u09a8\u09be\u09a4\u09bf \u09a4\u09be\u09b0 \u09ee\u09e6 \u09ac\u099b\u09b0 \u09ac\u09df\u09b8\u09bf \u09a6\u09be\u09a6\u09c1\u0995\u09c7 \u099c\u09bf\u099c\u09cd\u099e\u09c7\u09b8 \u0995\u09b0\u09b2:\n\u200b\u201c\u09a6\u09be\u09a6\u09c1... \u0995\u09c0\u09ad\u09be\u09ac\u09c7 \u09a4\u09c1\u09ae\u09bf \u09ec\u09e6 \u09ac\u099b\u09b0 \u09a7\u09b0\u09c7 \u098f\u0995\u0987 \u09a8\u09be\u09b0\u09c0\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u099f\u09bf\u0995\u09c7 \u09a5\u09be\u0995\u09a4\u09c7 \u09aa\u09be\u09b0\u09b2\u09c7?\u201d\n\u200b\u09a8\u09be\u09a4\u09bf\u09b0 \u09aa\u09cd\u09b0\u09a4\u09cd\u09af\u09be\u09b6\u09be \u099b\u09bf\u09b2 \u09a6\u09be\u09a6\u09c1 \u09b9\u09df\u09a4\u09cb \u098f\u09ae\u09a8 \u0989\u09a4\u09cd\u09a4\u09b0 \u09a6\u09c7\u09ac\u09c7\u09a8:\n\u200b\u201c\u09a4\u09cb\u09ae\u09be\u09b0 \u09aa\u09be\u09b0\u09b8\u09cd\u09aa\u09b0\u09bf\u0995 \u09ac\u09cb\u099d\u09be\u09aa\u09dc\u09be \u09a5\u09be\u0995\u09a4\u09c7 \u09b9\u09ac\u09c7...\u201d\n\u201c\u0996\u09c1\u09b2\u09c7 \u0995\u09a5\u09be \u09ac\u09b2\u09a4\u09c7 \u09b9\u09ac\u09c7...\u201d\n\u201c\u0986\u09aa\u09b8 \u098f\u09ac\u0982 \u09ae\u09be\u09a8\u09bf\u09df\u09c7 \u09a8\u09c7\u0993\u09df\u09be\u09b0 \u0995\u09cd\u09b7\u09ae\u09a4\u09be \u09a5\u09be\u0995\u09a4\u09c7 \u09b9\u09ac\u09c7...\u201d\n\u200b\u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09a6\u09be\u09a6\u09c1 \u09ae\u09c1\u099a\u0995\u09bf \u09b9\u09be\u09b8\u09b2\u09c7\u09a8, \u098f\u0995 \u09ae\u09c1\u09b9\u09c2\u09b0\u09cd\u09a4\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u09a6\u09be\u09a6\u09bf\u09b0 \u09a6\u09bf\u0995\u09c7 \u09a4\u09be\u0995\u09be\u09b2\u09c7\u09a8 \u098f\u09ac\u0982 \u09ac\u09b2\u09b2\u09c7\u09a8:\n\u200b\u201c\u0995\u09c7 \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09ac\u09b2\u09b2 \u09af\u09c7 \u0986\u09ae\u09bf \u09ec\u09e6 \u09ac\u099b\u09b0 \u09a7\u09b0\u09c7 \u098f\u0995\u0987 \u09a8\u09be\u09b0\u09c0\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u099b\u09bf\u09b2\u09be\u09ae?\u201d\n\u200b\u09a8\u09be\u09a4\u09bf \u0985\u09ac\u09be\u0995 \u09b9\u09df\u09c7 \u0997\u09c7\u09b2\u0964\n\u200b\u09a6\u09be\u09a6\u09be \u09ac\u09b2\u09a4\u09c7 \u09b2\u09be\u0997\u09b2\u09c7\u09a8...\n\u200b\u201c\u0995\u09c1\u09dc\u09bf \u09ac\u099b\u09b0 \u09ac\u09df\u09b8\u09c7 \u0986\u09ae\u09bf \u09a4\u09be\u09b0 \u09b8\u09cc\u09a8\u09cd\u09a6\u09b0\u09cd\u09af \u098f\u09ac\u0982 \u099c\u09c0\u09ac\u09a8\u09cd\u09a4 \u0986\u09a4\u09cd\u09ae\u09be\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09aa\u09dc\u09c7\u099b\u09bf\u09b2\u09be\u09ae\u0964\n\u09b8\u09c7\u099f\u09bf \u099b\u09bf\u09b2 \u0986\u09ae\u09be\u09b0 \u09aa\u09cd\u09b0\u09a5\u09ae \u09aa\u09cd\u09b0\u09c7\u09ae\u0964 \u2764\ufe0f\n\u200b\u09a4\u09cd\u09b0\u09bf\u09b6 \u09ac\u099b\u09b0 \u09ac\u09df\u09b8\u09c7 \u09b8\u09c7 \u09ae\u09be \u09b9\u09b2\u09cb\u0964 \u0986\u09ae\u09bf \u09b8\u09c7\u0987 \u09a8\u09be\u09b0\u09c0\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09aa\u09dc\u09b2\u09be\u09ae, \u09af\u09c7 \u09b8\u09be\u09b0\u09be\u09b0\u09be\u09a4 \u099c\u09c7\u0997\u09c7 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09b8\u09a8\u09cd\u09a4\u09be\u09a8\u0995\u09c7 \u09aa\u09b0\u09ae \u09af\u09a4\u09cd\u09a8\u09c7 \u0998\u09c1\u09ae \u09aa\u09be\u09dc\u09be\u09a4\u0964\n\u09b8\u09c7\u099f\u09bf \u099b\u09bf\u09b2 \u0986\u09ae\u09be\u09b0 \u09a6\u09cd\u09ac\u09bf\u09a4\u09c0\u09df \u09aa\u09cd\u09b0\u09c7\u09ae\u0964 \u2764\ufe0f\n\u200b\u099a\u09b2\u09cd\u09b2\u09bf\u09b6 \u09ac\u099b\u09b0 \u09ac\u09df\u09b8\u09c7 \u0986\u09ae\u09bf \u09b8\u09c7\u0987 \u09b8\u09be\u09b9\u09b8\u09c0 \u09a8\u09be\u09b0\u09c0\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09aa\u09dc\u09b2\u09be\u09ae, \u09af\u09c7 \u09b9\u09be\u09b8\u09bf\u09ae\u09c1\u0996\u09c7 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09aa\u09b0\u09bf\u09ac\u09be\u09b0\u09c7\u09b0 \u09b8\u09ae\u09b8\u09cd\u09a4 \u09a6\u09be\u09df\u09bf\u09a4\u09cd\u09ac \u09ac\u09b9\u09a8 \u0995\u09b0\u09c7\u099b\u09bf\u09b2\u0964\n\u09b8\u09c7\u099f\u09bf \u099b\u09bf\u09b2 \u0986\u09ae\u09be\u09b0 \u09a4\u09c3\u09a4\u09c0\u09df \u09aa\u09cd\u09b0\u09c7\u09ae\u0964 \u2764\ufe0f\n\u200b\u09aa\u099e\u09cd\u099a\u09be\u09b6 \u09ac\u099b\u09b0 \u09ac\u09df\u09b8\u09c7 \u0986\u09ae\u09bf \u09b8\u09c7\u0987 \u09a8\u09be\u09b0\u09c0\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09aa\u09dc\u09b2\u09be\u09ae, \u09af\u09c7 \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09b8\u09a8\u09cd\u09a4\u09be\u09a8\u09a6\u09c7\u09b0 \u09ad\u09ac\u09bf\u09b7\u09cd\u09af\u09a4\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u09a8\u09bf\u099c\u09c7\u09b0 \u09b8\u09cd\u09ac\u09aa\u09cd\u09a8 \u0993 \u0987\u099a\u09cd\u099b \u09ac\u09bf\u09b8\u09b0\u09cd\u099c\u09a8 \u09a6\u09bf\u09df\u09c7\u099b\u09bf\u09b2\u0964\n\u09b8\u09c7\u099f\u09bf \u099b\u09bf\u09b2 \u0986\u09ae\u09be\u09b0 \u099a\u09a4\u09c1\u09b0\u09cd\u09a5 \u09aa\u09cd\u09b0\u09c7\u09ae\u0964 \u2764\ufe0f\n\u200b\u09b7\u09be\u099f \u09ac\u099b\u09b0 \u09ac\u09df\u09b8\u09c7 \u09a4\u09be\u09b0 \u09ae\u09c1\u0996\u09c7 \u09ac\u09b2\u09bf\u09b0\u09c7\u0996\u09be \u09ab\u09c1\u099f\u09c7 \u0989\u09a0\u09c7\u099b\u09bf\u09b2, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u0986\u09ae\u09bf \u09b8\u09c7\u0987 \u09b8\u0999\u09cd\u0997\u09bf\u09a8\u09c0\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09aa\u09dc\u09b2\u09be\u09ae, \u09af\u09c7 \u0995\u09c7\u09ac\u09b2 \u098f\u0995\u099f\u09be \u099a\u09be\u0989\u09a8\u09bf\u09a4\u09c7\u0987 \u0986\u09ae\u09be\u09b0 \u09b8\u09ae\u09b8\u09cd\u09a4 \u09a6\u09c1\u09b6\u09cd\u099a\u09bf\u09a8\u09cd\u09a4\u09be \u09ac\u09c1\u099d\u09c7 \u09a8\u09bf\u09a4\u09c7 \u09aa\u09be\u09b0\u09a4\u0964\n\u09b8\u09c7\u099f\u09bf \u099b\u09bf\u09b2 \u0986\u09ae\u09be\u09b0 \u09aa\u099e\u09cd\u099a\u09ae \u09aa\u09cd\u09b0\u09c7\u09ae\u0964 \u2764\ufe0f\n\u200b\u09b8\u09a4\u09cd\u09a4\u09b0 \u09ac\u099b\u09b0 \u09ac\u09df\u09b8\u09c7 \u0986\u09ae\u09bf \u09b8\u09c7\u0987 \u09a8\u09be\u09b0\u09c0\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09aa\u09dc\u09b2\u09be\u09ae, \u09af\u09c7 \u09aa\u09cd\u09b0\u09a4\u09bf\u09a6\u09bf\u09a8 \u0986\u09ae\u09be\u0995\u09c7 \u099c\u09bf\u099c\u09cd\u099e\u09c7\u09b8 \u0995\u09b0\u09a4:\n\u200b\u2018\u09a4\u09c1\u09ae\u09bf \u0995\u09bf \u09a4\u09cb\u09ae\u09be\u09b0 \u0993\u09b7\u09c1\u09a7 \u0996\u09c7\u09df\u09c7\u099b?\u2019\n\u200b\u09a4\u09be\u09b0 \u098f\u0987 \u0997\u09ad\u09c0\u09b0 \u0989\u09a6\u09cd\u09ac\u09c7\u0997 \u0986\u09ae\u09be\u09b0 \u09b9\u09c3\u09a6\u09df \u099b\u09c1\u0981\u09df\u09c7 \u0997\u09bf\u09df\u09c7\u099b\u09bf\u09b2\u0964\n\u09b8\u09c7\u099f\u09bf \u099b\u09bf\u09b2 \u0986\u09ae\u09be\u09b0 \u09b7\u09b7\u09cd\u09a0 \u09aa\u09cd\u09b0\u09c7\u09ae\u0964 \u2764\ufe0f\n\u200b\u0986\u09b0 \u098f\u0996\u09a8, \u0986\u09b6\u09bf \u09ac\u099b\u09b0 \u09ac\u09df\u09b8\u09c7, \u0986\u09ae\u09bf \u09b8\u09c7\u0987 \u09a8\u09be\u09b0\u09c0\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09aa\u09dc\u09c7\u099b\u09bf \u09af\u09c7 \u0986\u09ae\u09be\u09b0 \u09aa\u09be\u09b6\u09c7 \u09a7\u09c0\u09b0\u09c7 \u09a7\u09c0\u09b0\u09c7 \u09b9\u09be\u0981\u099f\u09c7, \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u09aa\u09c1\u09b0\u09a8\u09cb \u09b8\u09cd\u09ae\u09c3\u09a4\u09bf\u0997\u09c1\u09b2\u09cb \u09ac\u09be\u09b0\u09ac\u09be\u09b0 \u09ac\u09b2\u09c7 \u098f\u09ac\u0982 \u0986\u09ae\u09be\u09b0 \u09b8\u09be\u09a5\u09c7 \u09b9\u09be\u09b8\u09be\u09b9\u09be\u09b8\u09bf \u0995\u09b0\u09c7\u0964\n\u09b8\u09c7\u099f\u09bf \u0986\u09ae\u09be\u09b0 \u09b8\u09aa\u09cd\u09a4\u09ae \u09aa\u09cd\u09b0\u09c7\u09ae\u0964 \u2764\ufe0f\n\u200b\u09a8\u09be\u09a4\u09bf \u099a\u09c1\u09aa \u0995\u09b0\u09c7 \u09b0\u0987\u09b2\u0964\n\u200b\u09a6\u09be\u09a6\u09be \u09b9\u09c7\u09b8\u09c7 \u0985\u09ac\u09b6\u09c7\u09b7\u09c7 \u09ac\u09b2\u09b2\u09c7\u09a8:\n\u200b\u201c\u09ac\u09bf\u09df\u09c7 \u09ae\u09be\u09a8\u09c7 \u09b8\u09be\u09b0\u09be \u099c\u09c0\u09ac\u09a8 \u098f\u0995\u0987 \u09ae\u09be\u09a8\u09c1\u09b7\u09c7\u09b0 \u09b8\u09be\u09a5\u09c7 \u0995\u09be\u099f\u09bf\u09df\u09c7 \u09a6\u09c7\u0993\u09df\u09be \u09a8\u09df\u0964\n\u200b\u09ac\u09bf\u09df\u09c7 \u09b9\u09b2\u09cb \u099c\u09c0\u09ac\u09a8\u09c7\u09b0 \u09aa\u09b0\u09bf\u09ac\u09b0\u09cd\u09a4\u09a8\u09c7\u09b0 \u09b8\u09be\u09a5\u09c7 \u09b8\u09be\u09a5\u09c7 \u098f\u0995\u0987 \u09ae\u09be\u09a8\u09c1\u09b7\u09c7\u09b0 \u09ac\u09bf\u09ad\u09bf\u09a8\u09cd\u09a8 \u09b0\u09c2\u09aa\u09c7\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09ac\u09be\u09b0\u09ac\u09be\u09b0 \u09aa\u09dc\u09c7 \u09af\u09be\u0993\u09df\u09be\u0964\u201d\n\u200b\u09b8\u09cc\u09a8\u09cd\u09a6\u09b0\u09cd\u09af \u09ac\u09a6\u09b2\u09be\u09df\u0964\n\u09ac\u09df\u09b8 \u09ac\u09a6\u09b2\u09be\u09df\u0964\n\u09b6\u09b0\u09c0\u09b0 \u09ac\u09a6\u09b2\u09be\u09df\u0964\n\u09aa\u09b0\u09bf\u09b8\u09cd\u09a5\u09bf\u09a4\u09bf \u09ac\u09a6\u09b2\u09be\u09df\u0964\n\u200b\u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09af\u09a6\u09bf \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u09aa\u09b0\u09bf\u09ac\u09b0\u09cd\u09a4\u09a8\u09c7\u09b0 \u09ae\u09a7\u09cd\u09af \u09a6\u09bf\u09df\u09c7\u0993 \u09a4\u09c1\u09ae\u09bf \u09a4\u09cb\u09ae\u09be\u09b0 \u099c\u09c0\u09ac\u09a8\u09b8\u0999\u09cd\u0997\u09c0\u09b0 \u09a6\u09bf\u0995\u09c7 \u09a4\u09be\u0995\u09bf\u09df\u09c7 \u09ac\u09b2\u09a4\u09c7 \u09aa\u09be\u09b0\u09cb...\n\u200b\u2764\ufe0f \u201c\u09a4\u09c1\u09ae\u09bf \u09b8\u09c7\u0987 \u09ae\u09be\u09a8\u09c1\u09b7\u099f\u09bf\u0987 \u0986\u099b\u09cb \u09af\u09be\u0995\u09c7 \u0986\u09ae\u09bf \u09ad\u09be\u09b2\u09cb\u09ac\u09c7\u09b8\u09c7\u099b\u09bf\u0964\u201d\n\u200b\u098f\u099f\u09be\u0987 \u09b9\u09b2\u09cb \u09a6\u09c0\u09b0\u09cd\u0998 \u0993 \u09b8\u09c1\u0996\u09c0 \u09a6\u09be\u09ae\u09cd\u09aa\u09a4\u09cd\u09af\u09c7\u09b0 \u0986\u09b8\u09b2 \u09b0\u09b9\u09b8\u09cd\u09af\u0964\n\u200b\u0995\u09be\u09b0\u09a3...\n\u200b\ud83c\udf39 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be \u09ae\u09be\u09a8\u09c7 \u0995\u09c7\u09ac\u09b2 \u098f\u0995\u09ac\u09be\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09aa\u09dc\u09be \u09a8\u09df\u0964\n\u200b\ud83c\udf39 \u09aa\u09cd\u09b0\u0995\u09c3\u09a4 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be \u09b9\u09b2\u09cb \u099c\u09c0\u09ac\u09a8\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u098b\u09a4\u09c1\u09a4\u09c7, \u098f\u0995\u0987 \u09ae\u09be\u09a8\u09c1\u09b7\u09c7\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09ac\u09be\u09b0\u09ac\u09be\u09b0 \u09aa\u09dc\u09c7 \u09af\u09be\u0993\u09df\u09be\u0964\n\u200b\u0986\u09b0 \u09b9\u09df\u09a4\u09cb \u09b8\u09ac\u099a\u09c7\u09df\u09c7 \u09b8\u09c1\u09a8\u09cd\u09a6\u09b0 \u09aa\u09cd\u09b0\u09b6\u09cd\u09a8\u099f\u09bf \u09b9\u09b2\u09cb:\n\u200b\u201c\u0986\u099c \u09a4\u09cb\u09ae\u09be\u09b0 \u099c\u09c0\u09ac\u09a8\u09b8\u0999\u09cd\u0997\u09c0 \u0995\u09bf \u09b8\u09c7\u0987 \u098f\u0995\u0987 \u09ae\u09be\u09a8\u09c1\u09b7, \u09af\u09be\u09b0 \u09aa\u09cd\u09b0\u09c7\u09ae\u09c7 \u09a4\u09c1\u09ae\u09bf \u09aa\u09cd\u09b0\u09a5\u09ae \u09aa\u09dc\u09c7\u099b\u09bf\u09b2\u09c7...?\u201d\n\u200b\u09a8\u09be\u0995\u09bf \u09b8\u09c7 \u09af\u09c7 \u098f\u09a4 \u09ac\u099b\u09b0\u09c7\u09b0, \u09b8\u0982\u0997\u09cd\u09b0\u09be\u09ae, \u09a4\u09cd\u09af\u09be\u0997, \u09b8\u09cd\u09ae\u09c3\u09a4\u09bf \u098f\u09ac\u0982 \u098f\u0995\u09b8\u09be\u09a5\u09c7 \u0995\u09be\u099f\u09be\u09a8\u09cb \u099c\u09c0\u09ac\u09a8\u09c7\u09b0 \u099b\u09be\u0981\u099a\u09c7 \u098f\u0995 \u09b8\u09c1\u09a8\u09cd\u09a6\u09b0 \u09a8\u09a4\u09c1\u09a8 \u09ae\u09be\u09a8\u09c1\u09b7\u09c7 \u09aa\u09b0\u09bf\u09a3\u09a4 \u09b9\u09df\u09c7\u099b\u09c7?\n\u200b\u2764\ufe0f \u09aa\u09cd\u09b0\u0995\u09c3\u09a4 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be \u098f\u0995 \u099c\u09be\u09df\u0997\u09be\u09df \u09b8\u09cd\u09a5\u09bf\u09b0 \u09a5\u09be\u0995\u09be\u09b0 \u09a8\u09be\u09ae \u09a8\u09df\u0964\n\u098f\u099f\u09bf \u09b9\u09b2\u09cb \u098f\u0995\u09b8\u09be\u09a5\u09c7 \u09ac\u09a6\u09b2\u09c7 \u09af\u09be\u0993\u09df\u09be... \u098f\u09ac\u0982 \u09aa\u09cd\u09b0\u09a4\u09bf\u09a6\u09bf\u09a8, \u09aa\u09cd\u09b0\u09a4\u09bf \u09ae\u09c1\u09b9\u09c2\u09b0\u09cd\u09a4\u09c7 \u098f\u0995\u09c7 \u0985\u09aa\u09b0\u0995\u09c7 \u09ac\u09c7\u099b\u09c7 \u09a8\u09c7\u0993\u09df\u09be\u0964 \u2764\ufe0f"}, {"title": "0003 01", "sub": "Text Document", "type": "document", "document_type": "text", "file": "0003_01.txt", "src": "documents/0003_01.txt", "thumbnail": "documents/0003_01.jpg", "text": "\u098f\u0995 \u0998\u09b0\u09c7\u0987 \u09af\u0996\u09a8 \u09a6\u09c1\u0987 \u0985\u09ac\u09bf\u09b6\u09cd\u09ac\u09be\u09b8\u09cd\u09af \u09aa\u09cd\u09b0\u09a4\u09bf\u09ad\u09be\u0964 \u09a8\u09cb\u09ac\u09c7\u09b2 \u09aa\u09be\u0993\u09df\u09be\u09b0 \u0996\u09ac\u09b0 \u09b6\u09c1\u09a8\u09c7 \u09ae\u09c7\u09df\u09c7\u09a6\u09c7\u09b0 \u09ac\u09c1\u0995\u09c7 \u099c\u09dc\u09bf\u09df\u09c7 \u09a7\u09b0\u09b2\u09c7\u09a8 \u09b8\u09a6\u09cd\u09af \u09a8\u09cb\u09ac\u09c7\u09b2\u099c\u09df\u09c0 \u0995\u09be\u09b0\u09cd\u09b2, \u09aa\u09be\u09b6\u09c7\u0987 \u09b8\u09cd\u09a4\u09cd\u09b0\u09c0 \u0985\u09a7\u09cd\u09af\u09be\u09aa\u0995 \u09a1\u09be\u0983 \u09ae\u09bf\u09b6\u09c7\u09b2\u0964 \n.\n\u09b8\u09cd\u099f\u09cd\u09af\u09be\u09a8\u09ab\u09cb\u09b0\u09cd\u09a1 \u09ac\u09bf\u09b6\u09cd\u09ac\u09ac\u09bf\u09a6\u09cd\u09af\u09be\u09b2\u09df\u09c7\u09b0 \u0995\u09be\u09b0\u09cd\u09b2 \u09a1\u09be\u0987\u09b8\u09be\u09b0\u09cb\u09a5 \u0997\u09a4\u0995\u09be\u09b2 \u09ae\u09c7\u09a1\u09bf\u09b8\u09bf\u09a8\u09c7 \u09a8\u09cb\u09ac\u09c7\u09b2 \u09aa\u09c7\u09b2\u09c7\u09a8\u0964  \u09a4\u09bf\u09a8\u09bf \u098f\u09ae\u09a8 \u098f\u0995\u099f\u09be \u09ac\u09bf\u09b7\u09df\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u09a8\u09cb\u09ac\u09c7\u09b2 \u09aa\u09c7\u09b2\u09c7\u09a8 \u09af\u09c7 \u09a4\u09be \u09ad\u09ac\u09bf\u09b7\u09cd\u09af\u09a4\u09c7 \u09ae\u09be\u09a8\u09ac \u09ae\u09b8\u09cd\u09a4\u09bf\u09b8\u09cd\u0995\u09c7\u09b0 \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be\u09b0\u0987 \u0997\u09a4\u09bf\u09aa\u09a5 \u09aa\u09be\u09b2\u09cd\u099f\u09c7 \u09a6\u09bf\u09ac\u09c7\u0964\n.\n\u0986\u0997\u09c7 \u098f\u0987 \u099b\u09ac\u09bf\u09b0 \u09a6\u09c1\u0987 \u0985\u09ac\u09bf\u09b6\u09cd\u09ac\u09be\u09b8\u09cd\u09af \u09aa\u09cd\u09b0\u09a4\u09bf\u09ad\u09be \u0995\u09c7\u09a8 \u09ac\u09b2\u09c7\u099b\u09bf \u09a4\u09be\u0987 \u09ac\u09b2\u09bf\u0964  \u0995\u09be\u09b0\u09cd\u09b2 \u09a1\u09be\u0987\u09b8\u09be\u09b0\u09cb\u09a5\u09c7\u09b0 \u09aa\u09be\u09b6\u09c7\u0987 \u09af\u09c7 \u09ad\u09a6\u09cd\u09b0\u09ae\u09b9\u09bf\u09b2\u09be \u09a6\u09be\u0981\u09dc\u09bf\u09df\u09c7 \u0986\u099b\u09c7\u09a8 \u09a4\u09bf\u09a8\u09bf \u09a4\u09be\u0981\u09b0 \u09b8\u09cd\u09a4\u09cd\u09b0\u09c0 \u09ae\u09bf\u09b6\u09c7\u09b2 \u09ae\u09a8\u099c\u09c7\u0964 \u09ae\u09bf\u09b6\u09c7\u09b2 \u09ae\u09a8\u099c\u09c7 \u09a8\u09bf\u099c\u09c7\u0993 \u098f\u0995\u099c\u09a8 \u09ac\u09bf\u09b6\u09cd\u09ac\u0996\u09cd\u09af\u09be\u09a4 \u09a8\u09bf\u0989\u09b0\u09cb \u09b8\u09be\u0987\u09a8\u09cd\u099f\u09bf\u09b8\u09cd\u099f\u0964 \u0995\u09cd\u09af\u09be\u09a8\u09cd\u09b8\u09be\u09b0 \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be\u09df  \u098f\u0995 \u09ae\u09b9\u09be\u09ac\u09bf\u09aa\u09cd\u09b2\u09ac \u0998\u099f\u09bf\u09df\u09c7\u099b\u09c7\u09a8 \u09ae\u09bf\u09b6\u09c7\u09b2\u0964\n.\n\u0995\u09be\u09b0\u09cd\u09b2 \u09ac\u09b2\u09c7\u099b\u09bf\u09b2\u09c7\u09a8 \u09ae\u09bf\u09b6\u09c7\u09b2 \u09ae\u09a8\u099c\u09c7\u09b0 \u09b8\u09be\u09b9\u09be\u09af\u09cd\u09af \u099b\u09be\u09dc\u09be \u09a4\u09be\u09b0 \u09aa\u0995\u09cd\u09b7\u09c7 \u098f\u0987 \u09b8\u09ab\u09b2\u09a4\u09be \u09b8\u09ae\u09cd\u09ad\u09ac \u099b\u09bf\u09b2\u09cb\u09a8\u09be\u0964 \u0986\u09ac\u09be\u09b0 \u09ae\u09bf\u09b6\u09c7\u09b2 \u0993 \u0995\u09be\u09b0\u09cd\u09b2\u09c7\u09b0  \u0986\u09ac\u09bf\u09b7\u09cd\u0995\u09c3\u09a4 \u0985\u09aa\u099f\u09cb\u099c\u09c7\u09a8\u09c7\u099f\u09bf\u0995\u09cd\u09b8 \u09a8\u09bf\u099c\u09c7\u09b0 \u09a8\u09bf\u0989\u09b0\u09cb \u0995\u09cd\u09af\u09be\u09a8\u09b8\u09be\u09b0 \u0997\u09ac\u09c7\u09b7\u09a3\u09be\u09df \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09c7\u099b\u09c7\u09a8\u0964\n.\n\u09a4\u09be\u0981\u09b0\u09be \u09a6\u09c1\u099c\u09a8\u09c7\u0987 \u09b8\u09cd\u099f\u09cd\u09af\u09be\u09a8\u09ab\u09cb\u09b0\u09cd\u09a1 \u09ac\u09bf\u09b6\u09cd\u09ac\u09ac\u09bf\u09a6\u09cd\u09af\u09be\u09b2\u09af\u09bc\u09c7\u09b0 \u0985\u09a7\u09cd\u09af\u09be\u09aa\u0995\u0964 \u0995\u09be\u09b0\u09cd\u09b2 \u09af\u09c7\u09ae\u09a8  \u09b8\u09cd\u099f\u09cd\u09af\u09be\u09a8\u09ab\u09cb\u09b0\u09cd\u09a1\u09c7\u09b0  \u09ac\u09be\u09af\u09bc\u09cb\u0987\u099e\u09cd\u099c\u09bf\u09a8\u09bf\u09af\u09bc\u09be\u09b0\u09bf\u0982 \u0993 \u09b8\u09be\u0987\u0995\u09bf\u09af\u09bc\u09be\u099f\u09cd\u09b0\u09bf \u09ac\u09bf\u09ad\u09be\u0997\u09c7\u09b0 \u0985\u09a7\u09cd\u09af\u09be\u09aa\u0995\u0964 \u09ae\u09bf\u09b6\u09c7\u09b2 \u09a4\u09c7\u09ae\u09a8\u09bf \u09a8\u09bf\u0989\u09b0\u09cb\u09b2\u099c\u09bf \u09ac\u09bf\u09ad\u09be\u0997\u09c7\u09b0  \u0985\u09a7\u09cd\u09af\u09be\u09aa\u0995\u0964 \u09ac\u09b0\u09cd\u09a4\u09ae\u09be\u09a8 \u09ac\u09bf\u09b6\u09cd\u09ac\u09c7 \u098f\u0987 \u09a6\u09ae\u09cd\u09aa\u09a4\u09cd\u09a4\u09bf\u0995\u09c7 \u09b8\u09b0\u09cd\u09ac\u09b6\u09cd\u09b0\u09c7\u09b7\u09cd\u09a0 \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be\u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u09c0 \u09a6\u09ae\u09cd\u09aa\u09a4\u09cd\u09a4\u09bf\u09a6\u09c7\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7 \u098f\u0995\u099c\u09a8 \u09a7\u09b0\u09be \u09b9\u09df\u0964\n\u09af\u09c7\u09ae\u09a8 \u099b\u09bf\u09b2\u09c7\u09a8 \u09ae\u09c7-\u09ac\u09cd\u09b0\u09bf\u099f \u09ae\u09cb\u099c\u09be\u09b0 \u0993  \u098f\u09a1\u09ad\u09be\u09b0\u09cd\u09a1 \u09ae\u09cb\u09b8\u09be\u09b0 \u09a6\u09ae\u09cd\u09aa\u09a4\u09cd\u09a4\u09bf\u0964 \u09af\u09a6\u09bf\u0993 \u09af\u09cc\u09a5\u09ad\u09be\u09ac\u09c7 \u09a8\u09cb\u09ac\u09c7\u09b2 \u09aa\u09be\u0993\u09df\u09be\u09b0 \u09a6\u09c1\u0987 \u09ac\u099b\u09b0\u09c7\u09b0 \u09ae\u09be\u09a5\u09be\u09df \u09a4\u09be\u0981\u09a6\u09c7\u09b0 \u09ac\u09bf\u099a\u09cd\u099b\u09c7\u09a6 \u09b9\u09df\u09c7 \u09af\u09be\u09df\u0964\n.\n\u0995\u09be\u09b0\u09cd\u09b2 \u098f\u09ac\u0982 \u09ae\u09bf\u09b6\u09c7\u09b2 \u09a8\u09bf\u099c\u09c7\u09a6\u09c7\u09b0 \u0997\u09ac\u09c7\u09b7\u09a3\u09be\u09b0 \u09aa\u09be\u09b6\u09be\u09aa\u09be\u09b6\u09bf \u0985\u09a8\u09c7\u0995 \u099c\u099f\u09bf\u09b2 \u09b8\u09cd\u09a8\u09be\u09af\u09bc\u09c1\u09ac\u09bf\u0995 \u09b0\u09cb\u0997 \u0993 \u0995\u09cd\u09af\u09be\u09a8\u09cd\u09b8\u09be\u09b0 \u0997\u09ac\u09c7\u09b7\u09a3\u09be\u09af\u09bc \u09af\u09cc\u09a5\u09ad\u09be\u09ac\u09c7 \u0995\u09be\u099c \u0995\u09b0\u09c7\u099b\u09bf\u09b2\u09c7\u09a8\u0964\n.\n\u0995\u09be\u09b0\u09cd\u09b2 \u09a1\u09be\u0987\u09b8\u09be\u09b0\u09cb\u09a5\u09c7\u09b0 \u09a8\u09cb\u09ac\u09c7\u09b2 \u099c\u09df\u09c7\u09b0 \u0995\u09be\u09b0\u09a3, \u09a4\u09bf\u09a8\u09bf \u098f\u09ae\u09a8 \u098f\u0995 \u0989\u09a6\u09cd\u09ad\u09be\u09ac\u09a8 \u0995\u09b0\u09c7\u099b\u09c7\u09a8, \u09af\u09be \u0987\u0981\u09a6\u09c1\u09b0\u09c7\u09b0 \u09ae\u09b8\u09cd\u09a4\u09bf\u09b7\u09cd\u0995\u0995\u09c7 \u09a8\u09bf\u09df\u09a8\u09cd\u09a4\u09cd\u09b0\u09a3 \u0995\u09b0\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7\u0964 \u09ad\u09ac\u09bf\u09b7\u09cd\u09af\u09a4\u09c7 \u09a4\u09be \u09ae\u09be\u09a8\u09c1\u09b7\u09c7\u09b0 \u0995\u09cd\u09b7\u09c7\u09a4\u09cd\u09b0\u09c7\u0993 \u09b8\u09ab\u09b2 \u09b9\u0993\u09df\u09be\u09b0 \u09ac\u09cd\u09af\u09be\u09aa\u0995 \u09b8\u09ae\u09cd\u09ad\u09be\u09ac\u09a8\u09be \u09b0\u09df\u09c7\u099b\u09c7\u0964 \u0995\u09be\u09b0\u09cd\u09b2 \u09a8\u09cb\u09ac\u09c7\u09b2 \u09aa\u09c7\u09df\u09c7\u099b\u09c7\u09a8  \u0985\u09aa\u099f\u09cb\u099c\u09c7\u09a8\u09c7\u099f\u09bf\u0995\u09cd\u09b8 \u098f\u09b0 \u099c\u09a8\u09cd\u09af\u0964  \u09ae\u09c2\u09b2\u09a4 \u0985\u09aa\u099f\u09cb\u099c\u09c7\u09a8\u09c7\u099f\u09bf\u0995\u09cd\u09b8 \u09b9\u09b2\u09cb \u098f\u09ae\u09a8 \u098f\u0995\u099f\u09bf \u09ac\u09c8\u099c\u09cd\u099e\u09be\u09a8\u09bf\u0995 \u09aa\u09a6\u09cd\u09a7\u09a4\u09bf, \u09af\u09be\u09b0 \u09ae\u09be\u09a7\u09cd\u09af\u09ae\u09c7 \u0986\u09b2\u09cb\u09b0 \u09b8\u09be\u09b9\u09be\u09af\u09cd\u09af\u09c7 \u099c\u09c0\u09ac\u09a8\u09cd\u09a4 \u09aa\u09cd\u09b0\u09be\u09a3\u09c0\u09b0 \u09ae\u09b8\u09cd\u09a4\u09bf\u09b7\u09cd\u0995\u09c7\u09b0 \u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f \u09b8\u09cd\u09a8\u09be\u09af\u09bc\u09c1\u0995\u09cb\u09b7 \u09ac\u09be \u09a8\u09bf\u0989\u09b0\u09a8\u09c7\u09b0 \u0995\u09be\u09b0\u09cd\u09af\u0995\u09be\u09b0\u09bf\u09a4\u09be \u09a8\u09bf\u09af\u09bc\u09a8\u09cd\u09a4\u09cd\u09b0\u09a3 \u0995\u09b0\u09be \u09af\u09be\u09af\u09bc\u0964\n.\n\u098f\u0987 \u09aa\u09cd\u09b0\u09af\u09c1\u0995\u09cd\u09a4\u09bf\u09b0 \u0989\u09a6\u09cd\u09ad\u09be\u09ac\u09a8 \u09ae\u09be\u09a8\u09ac \u09ae\u09b8\u09cd\u09a4\u09bf\u09b7\u09cd\u0995\u09c7\u09b0 \u099c\u099f\u09bf\u09b2 \u09b0\u09b9\u09b8\u09cd\u09af \u0989\u09a8\u09cd\u09ae\u09cb\u099a\u09a8\u09c7 \u098f\u0995 \u09a8\u09a4\u09c1\u09a8 \u09a6\u09bf\u0997\u09a8\u09cd\u09a4\u09c7\u09b0 \u09b8\u09c2\u099a\u09a8\u09be \u0995\u09b0\u09b2\u09cb\u0964 \u0995\u09be\u09b0\u09a3 \u098f\u0996\u09a8 \u09aa\u09b0\u09cd\u09af\u09a8\u09cd\u09a4 \u0997\u09ac\u09c7\u09b7\u0995\u09b0\u09be \u099c\u09be\u09a8\u09a4\u09c7 \u09aa\u09c7\u09b0\u09c7\u099b\u09c7\u09a8 \u0995\u09c0\u09ad\u09be\u09ac\u09c7 \u09ae\u09b8\u09cd\u09a4\u09bf\u09b7\u09cd\u0995\u09c7\u09b0 \u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f \u09b8\u09be\u09b0\u09cd\u0995\u09bf\u099f \u09ae\u09be\u09a8\u09c1\u09b7\u09c7\u09b0 \u09b8\u09cd\u09ae\u09c3\u09a4\u09bf, \u0985\u09a8\u09c1\u09ad\u09c2\u09a4\u09bf \u098f\u09ac\u0982 \u0986\u099a\u09b0\u09a3\u0995\u09c7 \u09a8\u09bf\u09af\u09bc\u09a8\u09cd\u09a4\u09cd\u09b0\u09a3 \u0995\u09b0\u09c7\u0964\n.\n\u09af\u09be \u09ac\u09bf\u09b7\u09a3\u09cd\u09a8\u09a4\u09be, \u0985\u099f\u09bf\u099c\u09ae, \u09b8\u09bf\u099c\u09cb\u09ab\u09cd\u09b0\u09c7\u09a8\u09bf\u09af\u09bc\u09be\u09b0 \u09ae\u09a4\u09cb \u099c\u099f\u09bf\u09b2 \u09ae\u09be\u09a8\u09b8\u09bf\u0995 \u09b0\u09cb\u0997\u09c7\u09b0 \u0989\u09ce\u09b8 \u09ac\u09c1\u099d\u09a4\u09c7 \u09b8\u09be\u09b9\u09be\u09af\u09cd\u09af \u0995\u09b0\u099b\u09c7\u0964 \u0985\u09a8\u09cd\u09a7\u09a4\u09cd\u09ac \u09a6\u09c2\u09b0 \u0995\u09b0\u09a4\u09c7 \u098f\u09ac\u0982 \u09ae\u09be\u09a8\u09c1\u09b7\u09c7\u09b0 \u09a6\u09c3\u09b7\u09cd\u099f\u09bf\u09b6\u0995\u09cd\u09a4\u09bf \u09ab\u09bf\u09b0\u09bf\u09af\u09bc\u09c7 \u0986\u09a8\u09be\u09b0 \u0997\u09ac\u09c7\u09b7\u09a3\u09be\u09a4\u09c7\u0993 \u0985\u09aa\u099f\u09cb\u099c\u09c7\u09a8\u09c7\u099f\u09bf\u0995\u09cd\u09b8 \u09aa\u09a6\u09cd\u09a7\u09a4\u09bf \u09aa\u09cd\u09b0\u09af\u09bc\u09cb\u0997 \u0995\u09b0\u09be \u09b9\u099a\u09cd\u099b\u09c7 \u098f\u09ac\u0982 \u09ad\u09ac\u09bf\u09b7\u09cd\u09af\u09a4\u09c7 \u0986\u09b0\u0993 \u09a8\u09bf\u0996\u09c1\u0981\u09a4\u09ad\u09be\u09ac\u09c7 \u09b9\u09ac\u09c7\u0964\n.\n\u0986\u0997\u09c7 \u09af\u09c7\u0996\u09be\u09a8\u09c7 \u09ae\u09b8\u09cd\u09a4\u09bf\u09b7\u09cd\u0995\u09c7\u09b0 \u0995\u09cb\u09a8\u09cb \u0985\u0982\u09b6\u0995\u09c7 \u0989\u09a6\u09cd\u09a6\u09c0\u09aa\u09bf\u09a4 \u0995\u09b0\u09a4\u09c7 \u0987\u09b2\u09c7\u0995\u099f\u09cd\u09b0\u09cb\u09a1 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09be \u09b9\u09a4\u09cb ( \u098f\u0996\u09a8 \u0985\u09aa\u099f\u09cb\u099c\u09c7\u09a8\u09c7\u099f\u09bf\u0995\u09cd\u09b8\u09c7\u09b0 \u09ae\u09be\u09a7\u09cd\u09af\u09ae\u09c7 \u0995\u09cb\u09a8\u09cb \u0995\u09cd\u09b7\u09a4\u09bf \u099b\u09be\u09dc\u09be\u0987 \u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f \u098f\u0995\u099f\u09bf \u09a8\u09bf\u0989\u09b0\u09a8\u0995\u09c7 \u0986\u09b2\u09cb\u09b0 \u09b8\u09be\u09b9\u09be\u09af\u09cd\u09af\u09c7 \u09b8\u09c1\u0987\u099a\u09c7\u09b0 \u09ae\u09a4\u09cb '\u0985\u09a8' \u09ac\u09be '\u0985\u09ab' \u0995\u09b0\u09be \u09af\u09be\u09df\u0964\n.\n\u0986\u0997\u09c7 \u0987\u09b2\u09c7\u0995\u099f\u09cd\u09b0\u09cb\u09a1 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09b2\u09c7 \u098f\u099f\u09bf \u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f \u0985\u0982\u09b6 \u099b\u09be\u09dc\u09be\u0993 \u0986\u09b6\u09c7\u09aa\u09be\u09b6\u09c7\u09b0 \u09b8\u09ac \u0995\u09cb\u09b7\u0995\u09c7 \u098f\u0995\u09b8\u09be\u09a5\u09c7 \u09aa\u09cd\u09b0\u09ad\u09be\u09ac\u09bf\u09a4 \u0995\u09b0\u09a4\u09cb\u0964 \u09ab\u09b2\u09c7 \u098f\u099f\u09be \u09ac\u09cb\u099d\u09be \u09af\u09c7\u09a4\u09cb\u09a8\u09be\u0964\n\u098f\u0996\u09a8 \u09af\u0996\u09a8\u0987 \u09ab\u09be\u0987\u09ac\u09be\u09b0 \u0985\u09aa\u099f\u09bf\u0995\u09c7\u09b0 \u09ae\u09be\u09a7\u09cd\u09af\u09ae\u09c7 \u09a8\u09c0\u09b2 \u0986\u09b2\u09cb \u09ab\u09c7\u09b2\u09be \u09b9\u09df, \u09a4\u0996\u09a8 \u09a8\u09bf\u0989\u09b0\u09a8\u099f\u09bf \u09b8\u0995\u09cd\u09b0\u09bf\u09df \u09b9\u09df\u09c7 \u09ae\u09b8\u09cd\u09a4\u09bf\u09b7\u09cd\u0995\u09c7 \u09b8\u0982\u0995\u09c7\u09a4 \u09aa\u09be\u09a0\u09be\u09df\u0964 \u0986\u09ac\u09be\u09b0 \u0995\u09cb\u09a8\u09cb \u0995\u09cb\u09a8\u09cb \u09ac\u09bf\u09b6\u09c7\u09b7 \u09aa\u09cd\u09b0\u09cb\u099f\u09bf\u09a8\u09c7\u09b0 \u0993\u09aa\u09b0 \u09b9\u09b2\u09c1\u09a6 \u0986\u09b2\u09cb \u09ab\u09c7\u09b2\u09b2\u09c7 \u09a8\u09bf\u0989\u09b0\u09a8\u099f\u09bf \u09a8\u09bf\u09b7\u09cd\u0995\u09cd\u09b0\u09bf\u09df \u0985\u09b0\u09cd\u09a5\u09be\u09ce \u0985\u09ab \u09b9\u09df\u09c7 \u09af\u09be\u09df\u0964\n.\n\u098f\u099f\u09be \u0995\u09bf \u09af\u09c7 \u09ab\u09b2\u09aa\u09cd\u09b0\u09b8\u09c2 \u09a4\u09be \u09ac\u09b2\u09be\u09b0 \u0985\u09aa\u09c7\u0995\u09cd\u09b7\u09be \u09b0\u09be\u0996\u09c7\u09a8\u09be\u0964 \u0995\u09be\u09b0\u09a3 \u09ae\u09be\u09a8\u09ac \u09ae\u09b8\u09cd\u09a4\u09bf\u09b7\u09cd\u0995\u09c7 \u09aa\u09cd\u09b0\u09be\u09df \u09e7\u09e6\u09e6 \u09ac\u09bf\u09b2\u09bf\u09df\u09a8 \u09a8\u09bf\u0989\u09b0\u09a8 \u09b0\u09df\u09c7\u099b\u09c7\u0964 \u098f\u0987 \u099c\u099f\u09bf\u09b2 \u09a8\u09c7\u099f\u0993\u09df\u09be\u09b0\u09cd\u0995\u09c7\u09b0 \u09a0\u09bf\u0995 \u0995\u09cb\u09a8 \u0985\u0982\u09b6\u099f\u09bf \u0986\u09ae\u09be\u09a6\u09c7\u09b0 \u0995\u09cb\u09a8 \u0986\u099a\u09b0\u09a3 \u09ac\u09be \u0986\u09ac\u09c7\u0997\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u09a6\u09be\u09df\u09c0, \u09a4\u09be \u0986\u0997\u09c7 \u09b8\u09c1\u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f\u09ad\u09be\u09ac\u09c7 \u099c\u09be\u09a8\u09be \u0985\u09b8\u09ae\u09cd\u09ad\u09ac \u099b\u09bf\u09b2\u0964 \u0985\u09aa\u099f\u09cb\u099c\u09c7\u09a8\u09c7\u099f\u09bf\u0995\u09cd\u09b8 \u098f\u0987 \u0985\u09b8\u09ae\u09cd\u09ad\u09ac\u0995\u09c7 \u09b8\u09ae\u09cd\u09ad\u09ac \u0995\u09b0\u09c7\u099b\u09c7\u0964\n\u0995\u09be\u09b0\u09cd\u09b2 \u09a1\u09be\u0987\u09b8\u09be\u09b0\u09cb\u09a5\u09b0\u09be \u098f\u0987 \u09aa\u09b0\u09c0\u0995\u09cd\u09b7\u09be\u099f\u09bf \u099a\u09be\u09b2\u09bf\u09df\u09c7\u099b\u09c7\u09a8 \u0987\u0981\u09a6\u09c1\u09b0\u09c7\u09b0 \u0989\u09aa\u09b0\u0964 \u09b8\u09c7\u0996\u09be\u09a8\u09c7 \u09a6\u09c7\u0996\u09be \u0997\u09c7\u099b\u09c7   \u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u09c0\u09b0\u09be \u0987\u0981\u09a6\u09c1\u09b0\u09c7\u09b0 \u09ae\u09b8\u09cd\u09a4\u09bf\u09b7\u09cd\u0995\u09c7\u09b0 \u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f \u0995\u09cb\u09b7\u09c7 \u0986\u09b2\u09cb \u09ab\u09c7\u09b2\u09c7 \u09a4\u09be\u09b0 \u09ad\u09df, \u0995\u09cd\u09b7\u09c1\u09a7\u09be, \u09b0\u09be\u0997 \u09ac\u09be \u09b8\u09cd\u09ae\u09c3\u09a4\u09bf\u09b0 \u09ae\u09a4\u09cb \u09ac\u09bf\u09b7\u09df\u0997\u09c1\u09b2\u09cb\u0995\u09c7 \u09a4\u09be\u09ce\u0995\u09cd\u09b7\u09a3\u09bf\u0995\u09ad\u09be\u09ac\u09c7 \u099a\u09be\u09b2\u09a8\u09be \u09ac\u09be \u09aa\u09b0\u09bf\u09ac\u09b0\u09cd\u09a4\u09a8 \u0995\u09b0\u09a4\u09c7 \u09b8\u0995\u09cd\u09b7\u09ae \u09b9\u09df\u09c7\u099b\u09c7\u09a8\u0964\n.\n\u0995\u09be\u09b0\u09cd\u09b2\u09c7\u09b0 \u0986\u0997\u09c7 \u09a6\u09c1\u0987 \u099c\u09be\u09b0\u09cd\u09ae\u09be\u09a8 \u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u09c0 \u09aa\u09bf\u099f\u09be\u09b0 \u09b9\u09c7\u0997\u09c7\u09ae\u09be\u09a8 \u0993 \u099c\u09b0\u09cd\u099c \u09a8\u09be\u0997\u09c7\u09b2 \u098f\u0995\u099f\u09bf \u098f\u0995\u0995\u09cb\u09b7\u09c0 \u09b6\u09c8\u09ac\u09be\u09b2\u09c7\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7 \u2018\u099a\u09cd\u09af\u09be\u09a8\u09c7\u09b2\u09b0\u09cb\u09a1\u09cb\u09aa\u09b8\u09bf\u09a8\u2019 \u09a8\u09be\u09ae\u09c7\u09b0 \u098f\u0995 \u09aa\u09cd\u09b0\u09cb\u099f\u09bf\u09a8 \u0986\u09ac\u09bf\u09b7\u09cd\u0995\u09be\u09b0 \u0995\u09b0\u09c7\u099b\u09bf\u09b2\u09c7\u09a8\u0964 \u09aa\u09b0\u09c7 \u0995\u09be\u09b0\u09cd\u09b2 \u09a1\u09be\u0987\u09b8\u09c7\u09b0\u09a5 \u0993\u0987 \u09aa\u09cd\u09b0\u09cb\u099f\u09bf\u09a8\u0995\u09c7 \u09b8\u09cd\u09a8\u09be\u09df\u09c1\u0995\u09cb\u09b7\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u098f\u0995\u099f\u09bf \u0986\u09b2\u09cb\u0995-\u09a8\u09bf\u09df\u09a8\u09cd\u09a4\u09cd\u09b0\u09bf\u09a4 \u09b8\u09c1\u0987\u099a\u09c7 \u09b0\u09c2\u09aa\u09be\u09a8\u09cd\u09a4\u09b0 \u0995\u09b0\u09c7\u09a8\u0964\n.\n\u09aa\u09bf\u099f\u09be\u09b0 \u09b9\u09c7\u0997\u09c7\u09ae\u09be\u09a8 \u0993 \u099c\u09b0\u09cd\u099c \u09a8\u09be\u0997\u09c7\u09b2\u0993 \u0995\u09be\u09b0\u09cd\u09b2\u09c7\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u098f \u09ac\u099b\u09b0 \u09a8\u09cb\u09ac\u09c7\u09b2 \u09aa\u09c7\u09df\u09c7\u099b\u09c7\u09a8\u0964\n.\n\u0985\u09a8\u09cd\u09af\u09a6\u09bf\u0995\u09c7 \u09ae\u09bf\u09b6\u09c7\u09b2 \u09ae\u09a8\u099c\u09c7  \u0986\u09ac\u09bf\u09b7\u09cd\u0995\u09be\u09b0 \u0995\u09b0\u09c7\u099b\u09c7\u09a8 \u09ac\u09cd\u09b0\u09c7\u09a8 \u0995\u09cd\u09af\u09be\u09a8\u09cd\u09b8\u09be\u09b0 \u0995\u09c0\u09ad\u09be\u09ac\u09c7 \u09ae\u09b8\u09cd\u09a4\u09bf\u09b7\u09cd\u0995\u09c7\u09b0 \u09b8\u09bf\u0997\u09a8\u09cd\u09af\u09be\u09b2 \u09b9\u09be\u0987\u099c\u09cd\u09af\u09be\u0995 \u0995\u09b0\u09c7 \u09ac\u09c3\u09a6\u09cd\u09a7\u09bf \u09aa\u09be\u09df, \u09af\u09be \u0995\u09cd\u09af\u09be\u09a8\u09cd\u09b8\u09be\u09b0 \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be\u09df \u098f\u0995 \u09ac\u09bf\u09b6\u09be\u09b2 \u09ae\u09be\u0987\u09b2\u09ab\u09b2\u0995 \u09a7\u09b0\u09be \u09b9\u09df\u0964 \u09ae\u09a8\u099c\u09c7 \u0995\u09c7 \u09ac\u09b2\u09be \u09b9\u09df \u0995\u09cd\u09af\u09be\u09a8\u09b8\u09be\u09b0 \u09a8\u09bf\u0989\u09b0\u09cb\u09b8\u09be\u09df\u09c7\u09a8\u09cd\u09b8\u09c7\u09b0 \u09ac\u09b0\u09cd\u09a4\u09ae\u09be\u09a8 \u09ac\u09bf\u09b6\u09cd\u09ac\u09c7\u09b0 \u09b8\u09ac\u099a\u09c7\u09df\u09c7 \u09b6\u09c0\u09b0\u09cd\u09b7 \u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u09c0\u0964\n.\n\u09b6\u09bf\u09b6\u09c1\u09a6\u09c7\u09b0 \u098f\u0995\u099f\u09bf \u0985\u09a4\u09cd\u09af\u09a8\u09cd\u09a4 \u09ae\u09be\u09b0\u09be\u09a4\u09cd\u09ae\u0995 \u0993 \u09a8\u09bf\u09b0\u09be\u09ae\u09df-\u0985\u09af\u09cb\u0997\u09cd\u09af \u09ac\u09cd\u09b0\u09c7\u09a8 \u099f\u09bf\u0989\u09ae\u09be\u09b0 \u09b9\u09b2\u09cb \u09a1\u09bf\u0986\u0987\u09aa\u09bf\u099c\u09bf (Diffuse Intrinsic Pontine Glioma)\u0964 \u09ae\u09a8\u099c\u09c7 \u09b9\u09b2\u09c7\u09a8 \u09aa\u09cd\u09b0\u09a5\u09ae \u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u09c0 \u09af\u09bf\u09a8\u09bf \u09b2\u09cd\u09af\u09be\u09ac\u09b0\u09c7\u099f\u09b0\u09bf\u09a4\u09c7 \u098f\u0987 \u0995\u09cd\u09af\u09be\u09a8\u09b8\u09be\u09b0\u09c7\u09b0 \u0995\u09cb\u09b7 \u09b8\u09ab\u09b2\u09ad\u09be\u09ac\u09c7 \u0995\u09be\u09b2\u099a\u09be\u09b0 \u0995\u09b0\u09a4\u09c7 \u09aa\u09c7\u09b0\u09c7\u099b\u09bf\u09b2\u09c7\u09a8\u0964\n.\n\u0995\u09cd\u09af\u09be\u09a8\u09b8\u09be\u09b0 \u09b0\u09cb\u0997\u09c0\u09a6\u09c7\u09b0 \u0995\u09bf\u09ae\u09cb\u09a5\u09c7\u09b0\u09be\u09aa\u09bf\u09b0 \u09aa\u09b0 \u09af\u09c7 \u09ae\u09be\u09a8\u09b8\u09bf\u0995 \u09af\u09c7 \u09ac\u09bf\u09ad\u09cd\u09b0\u09be\u09a8\u09cd\u09a4\u09bf  \u09b9\u09df, \u09a4\u09be\u09b0 \u09aa\u09c7\u099b\u09a8\u09c7\u09b0 \u09b8\u09cd\u09a8\u09be\u09df\u09ad\u09bf\u09a4\u09cd\u09a4\u09bf\u0995 \u09af\u09c7 \u0995\u09be\u09b0\u09a3 \u0993 \u09ae\u09be\u0987\u0995\u09cd\u09b0\u09cb\u0997\u09cd\u09b2\u09bf\u09df\u09be \u0995\u09cb\u09b7\u09c7\u09b0 \u09ad\u09c2\u09ae\u09bf\u0995\u09be \u09a4\u09bf\u09a8\u09bf\u0987 \u09aa\u09cd\u09b0\u09a5\u09ae \u0989\u09a8\u09cd\u09ae\u09cb\u099a\u09a8 \u0995\u09b0\u09c7\u099b\u09bf\u09b2\u09c7\u09a8\u0964\n.\n\u0995\u09be\u09b0\u09cd\u09b2 \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be \u09a8\u09be \u0995\u09b0\u09b2\u09c7\u0993 \u09ae\u09bf\u09b6\u09c7\u09b2 \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09a8\u09bf\u099c\u09c7 \u09aa\u09cd\u09b0\u09cd\u09af\u09be\u0995\u099f\u09bf\u09b8\u09bf\u0982 \u09a1\u09be\u0995\u09cd\u09a4\u09be\u09b0\u0993\u0964\n.\n\u09ae\u09bf\u09b6\u09c7\u09b2 \u09a4\u09be\u0981\u09b0 \u09b2\u09cd\u09af\u09be\u09ac\u09c7\u09b0 \u0986\u09ac\u09bf\u09b7\u09cd\u0995\u09be\u09b0\u0995\u09c7 \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u0995\u09cd\u09b2\u09bf\u09a8\   function closeNavToLanding(){
    closeDrawer();
    if (mainContent) mainContent.classList.remove('visible');
    if (inviteBanner) inviteBanner.style.display = 'block';
    if (landingProfile) landingProfile.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  navToggle.addEventListener('click', openDrawer);
  navClose.addEventListener('click', closeNavToLanding);
  navOverlay.addEventListener('click', closeNavToLanding);

  // ---------- More: Our Story / Documents ----------
  var moreData = JSON.parse(document.getElementById('moreData').textContent);
  var ourStoryBtn = document.getElementById('ourStoryBtn');
  var documentsBtn = document.getElementById('documentsBtn');
  var moreSection = document.getElementById('moreSection');
  var storyModal = document.getElementById('storyModal');
  var pdfModal = document.getElementById('pdfModal');
  var storyText = document.getElementById('storyText');
  var pdfFrame = document.getElementById('pdfFrame');
  var pdfTitle = document.getElementById('pdfTitle');
  var textModal = document.getElementById('textModal');
  var textTitle = document.getElementById('textTitle');
  var documentText = document.getElementById('documentText');

  var hasStory = typeof moreData.story === 'string' && moreData.story.trim() !== '';
  var documents = Array.isArray(moreData.documents) ? moreData.documents : [];

  if (!hasStory) {
    ourStoryBtn.style.display = 'none';
  } else {
    storyText.textContent = moreData.story;
  }

  if (!documents.length) {
    documentsBtn.style.display = 'none';
  } else {
    document.getElementById('countDocuments').textContent = documents.length;
  }

  // ---------- More: Audio files (background.mp3 is deliberately excluded) ----------
  var audioFiles = [];
  try {
    audioFiles = JSON.parse(document.getElementById('audioData').textContent || '[]');
  } catch (e) { audioFiles = []; }
  audioFiles = audioFiles.filter(function(item){
    return item && item.file && item.file.toLowerCase() !== 'background.mp3';
  });
  var audioFilesBtn = document.getElementById('audioFilesBtn');
  var audioFilesModal = document.getElementById('audioFilesModal');
  var audioFileList = document.getElementById('audioFileList');
  var audioFilePlayer = document.getElementById('audioFilePlayer');
  document.getElementById('countAudioFiles').textContent = audioFiles.length;
  if (!audioFiles.length) {
    audioFilesBtn.style.display = 'none';
  } else {
    audioFiles.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'audio-file-item';
      var details = document.createElement('div');
      details.className = 'audio-file-details';
      var name = document.createElement('span');
      name.className = 'audio-file-name';
      name.textContent = item.file; // show the exact filename, including extension
      details.appendChild(name);
      if (item.caption && item.caption.trim()) {
        var caption = document.createElement('span');
        caption.className = 'audio-file-caption';
        caption.textContent = item.caption;
        details.appendChild(caption);
      }
      var play = document.createElement('button');
      play.type = 'button';
      play.textContent = 'Play';
      play.setAttribute('aria-label', 'Play ' + item.file);
      play.addEventListener('click', function(){
        audioFilePlayer.src = item.src;
        audioFilePlayer.style.display = 'block';
        audioFilePlayer.play().catch(function(){});
        audioFilesModal.querySelectorAll('.audio-file-item button').forEach(function(button){ button.textContent = 'Play'; });
        play.textContent = 'Playing';
      });
      row.appendChild(details);
      row.appendChild(play);
      audioFileList.appendChild(row);
    });
    audioFilesBtn.addEventListener('click', function(){ openInfoModal(audioFilesModal); });
  }

  var externalLinksBtn = document.getElementById('externalLinksBtn');
  var externalLinksModal = document.getElementById('externalLinksModal');
  externalLinksBtn.addEventListener('click', function(){ openInfoModal(externalLinksModal); });

  if (!hasStory && !documents.length && !audioFiles.length) {
    // Keep More visible because External Links is a configured navigation item.
  }

  function openInfoModal(modal){
    closeDrawer();
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
  }

  ourStoryBtn.addEventListener('click', function(){ if (hasStory) openInfoModal(storyModal); });

  // ---------- More modal close buttons ----------
  document.querySelectorAll('.info-modal-close').forEach(function(button){
    button.addEventListener('click', function(){
      var modalId = button.getAttribute('data-modal');
      var modal = document.getElementById(modalId);
      if (!modal) return;
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');

      // Stop the PDF from continuing to load/play in the background.
      if (modalId === 'pdfModal') {
        pdfFrame.removeAttribute('src');
      }
      if (modalId === 'textModal') {
        documentText.textContent = '';
      }
      if (modalId === 'audioFilesModal') {
        audioFilePlayer.pause();
        audioFilePlayer.removeAttribute('src');
        audioFilePlayer.load();
        audioFilePlayer.style.display = 'none';
      }
    });
  });

  // ---------- Nav drawer: Photos / Videos / Documents / All filter ----------
  var filterButtons = {
    all: document.getElementById('filterAll'),
    photo: document.getElementById('filterPhotos'),
    video: document.getElementById('filterVideos'),
    document: document.getElementById('documentsBtn')
  };
  var photoCount = everything.filter(function(s){ return !s.type || s.type === 'photo'; }).length;
  var videoCount = everything.filter(function(s){ return s.type === 'video'; }).length;
  var documentCount = everything.filter(function(s){ return s.type === 'document'; }).length;
  document.getElementById('countAll').textContent = everything.length;
  document.getElementById('countPhotos').textContent = photoCount;
  document.getElementById('countVideos').textContent = videoCount;
  document.getElementById('countDocuments').textContent = documentCount;
  if (videoCount === 0){ filterButtons.video.style.display = 'none'; }
  if (documentCount === 0){ filterButtons.document.style.display = 'none'; }

  Object.keys(filterButtons).forEach(function(key){
    filterButtons[key].addEventListener('click', function(){
      typeFilter = key;
      Object.keys(filterButtons).forEach(function(k){
        filterButtons[k].classList.toggle('active', k === key);
      });
      applyFilters();
      showGallery();
    });
  });

  // ---------- Lightbox ----------
  var lightbox = document.getElementById('lightbox');
  var lbImage = document.getElementById('lbImage');
  var lbTitle = document.getElementById('lbTitle');
  var lbSub = document.getElementById('lbSub');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  // currentIndex is -1 while showing the hero/invitation, or 0..visible.length-1
  // for a position in the `visible` (searched/filtered) photo list. The two
  // are tracked with a separate `isHero` flag so a wrap-around photo index
  // of -1 is never confused with "show the hero".
  var currentIndex = -1;

  var lbVideo = document.getElementById('lbVideo');

  function showAt(index, isHero){
    var s;
    if (isHero){ s = hero; currentIndex = -1; }
    else { currentIndex = index; s = visible[index]; }

    if (s.type === 'video'){
      if (!lbImage.style.display || lbImage.style.display !== 'none') lbImage.style.display = 'none';
      lbImage.removeAttribute('src');
      lbVideo.style.display = 'block';
      lbVideo.src = s.src;
      lbVideo.currentTime = 0;
      pauseBgMusicForVideo();
      lbVideo.play().catch(function(){});
    } else {
      if (!lbVideo.paused) lbVideo.pause();
      lbVideo.removeAttribute('src'); lbVideo.load();
      lbVideo.style.display = 'none';
      lbImage.style.display = 'block';
      lbImage.src = s.src; lbImage.alt = s.title || '';
      resumeBgMusicIfWanted();
    }
    lbTitle.textContent = s.title || '';
    lbSub.textContent = s.sub || '';
  }
  function openLightbox(slide, index){
    if (index === -1) showAt(0, true);
    else showAt(index, false);
    var hasNav = visible.length > 0;
    lbPrev.style.visibility = hasNav ? 'visible' : 'hidden';
    lbNext.style.visibility = hasNav ? 'visible' : 'hidden';
    lightbox.classList.add('open');
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    if (!lbVideo.paused) lbVideo.pause();
    resumeBgMusicIfWanted();
  }
  function lbNextPhoto(){
    if (!visible.length) return;
    if (currentIndex === -1) showAt(0, false);
    else if (currentIndex + 1 >= visible.length) showAt(0, true);
    else showAt(currentIndex + 1, false);
  }
  function lbPrevPhoto(){
    if (!visible.length) return;
    if (currentIndex === -1) showAt(visible.length - 1, false);
    else if (currentIndex - 1 < 0) showAt(0, true);
    else showAt(currentIndex - 1, false);
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){ if (e.target === lightbox) closeLightbox(); });
  lbPrev.addEventListener('click', lbPrevPhoto);
  lbNext.addEventListener('click', lbNextPhoto);
  document.addEventListener('keydown', function(e){
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbPrev.click();
    if (e.key === 'ArrowRight') lbNext.click();
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    [storyModal, pdfModal, textModal].forEach(function(modal){
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    });
    pdfFrame.removeAttribute('src');
    audioFilePlayer.pause();
    audioFilePlayer.removeAttribute('src');
    audioFilePlayer.load();
    audioFilePlayer.style.display = 'none';
  });

  // ---------- Background music (controlled from the nav drawer) ----------
  var bgAudio = document.getElementById('bgAudio');
  var navAudioIcon = document.getElementById('navAudioIcon');
  var navAudioLabel = document.getElementById('navAudioLabel');
  var navAudioBtn = document.getElementById('navAudioBtn');
  var navMusicRow = navAudioBtn ? navAudioBtn.closest('.nav-music-row') : null;
  // Tracks whether the visitor *wants* music on, separately from whether
  // it's actually playing right now — a video in the lightbox pauses it
  // temporarily, and we only resume afterwards if they hadn't muted it.
  var userWantsMusic = true;

  function pauseBgMusicForVideo(){
    if (bgAudio && !bgAudio.paused) bgAudio.pause();
  }
  function resumeBgMusicIfWanted(){
    if (bgAudio && userWantsMusic && bgAudio.paused) attemptPlay();
  }

  function setAudioIcon(playing){
    navAudioIcon.innerHTML = playing
      ? '<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" stroke="none"/><path d="M16 8a5 5 0 0 1 0 8"/>'
      : '<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" stroke="none"/><line x1="15" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="15" y2="15"/>';
    navAudioLabel.textContent = playing ? 'Playing' : 'Paused';
    navAudioBtn.textContent = playing ? 'Pause' : 'Play';
  }
  function attemptPlay(){
    if (!bgAudio) return;
    var p = bgAudio.play();
    if (p && p.then){
      p.then(function(){ setAudioIcon(true); }).catch(function(){
        setAudioIcon(false);
        var startOnInteract = function(){
          if (userWantsMusic) bgAudio.play().then(function(){ setAudioIcon(true); }).catch(function(){});
        };
        document.addEventListener('click', startOnInteract, {once:true});
        document.addEventListener('touchstart', startOnInteract, {once:true});
      });
    }
  }
  if (!bgAudio){
    if (navMusicRow) navMusicRow.style.display = 'none';
    userWantsMusic = false;
  } else {
    navAudioBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if (bgAudio.paused){ userWantsMusic = true; bgAudio.play().then(function(){ setAudioIcon(true); }).catch(function(){}); }
      else { userWantsMusic = false; bgAudio.pause(); setAudioIcon(false); }
    });
  }
  setAudioIcon(false);
  attemptPlay();

  // ---------- Initial render ----------
  renderGallery();
})();
</script>
</body>
</html>
